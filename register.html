<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register | ZPPSU SmartMin</title>
<link rel="stylesheet" href="assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/seed.js"></script>
</head>
<body class="bg-background min-h-screen flex items-center justify-center p-gutter">

<div class="w-full max-w-[640px]">
  <a href="index.html" class="inline-flex items-center gap-xs text-on-surface-variant hover:text-primary mb-md font-body-sm">
    <span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to home
  </a>

  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-primary-lg p-xl">
    <div class="text-center mb-lg">
      <div class="w-14 h-14 mx-auto rounded-full bg-primary text-on-primary flex items-center justify-center shadow-primary-md mb-sm">
        <span class="material-symbols-outlined text-[28px]" style="font-variation-settings:'FILL' 1;">account_balance</span>
      </div>
      <h1 class="font-h1 text-h1 text-primary">Create your account</h1>
      <p class="font-body-md text-body-md text-on-surface-variant mt-xs">Join the ZPPSU SmartMin institutional platform.</p>
    </div>

    <form id="reg-form" class="grid grid-cols-1 md:grid-cols-2 gap-md">
      <div class="md:col-span-2">
        <label class="block font-label-caps text-label-caps text-on-surface mb-xs">Full Name</label>
        <input id="name" required class="w-full px-md py-md bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="Dr. Juan Dela Cruz"/>
      </div>
      <div>
        <label class="block font-label-caps text-label-caps text-on-surface mb-xs">Institutional Email</label>
        <input id="email" type="email" required class="w-full px-md py-md bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="user@zppsu.edu.ph"/>
      </div>
      <div>
        <label class="block font-label-caps text-label-caps text-on-surface mb-xs">Position / Designation</label>
        <input id="position" class="w-full px-md py-md bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="Associate Professor"/>
      </div>
      <div>
        <label class="block font-label-caps text-label-caps text-on-surface mb-xs">Role</label>
        <select id="role" required class="w-full px-md py-md bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg">
          <option value="faculty">Faculty</option>
          <option value="secretary">Secretary</option>
          <option value="head">Head / President</option>
          <option value="admin">System Administrator (requires approval)</option>
        </select>
      </div>
      <div>
        <label class="block font-label-caps text-label-caps text-on-surface mb-xs">Department / Office</label>
        <select id="department" required class="w-full px-md py-md bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg">
          <!-- populated by JS -->
        </select>
      </div>
      <div>
        <label class="block font-label-caps text-label-caps text-on-surface mb-xs">Password</label>
        <input id="password" type="password" required minlength="6" class="w-full px-md py-md bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="At least 6 characters"/>
      </div>
      <div>
        <label class="block font-label-caps text-label-caps text-on-surface mb-xs">Confirm Password</label>
        <input id="password2" type="password" required class="w-full px-md py-md bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="Repeat password"/>
      </div>
      <div class="md:col-span-2">
        <label class="flex items-center gap-xs">
          <input type="checkbox" required class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4"/>
          <span class="font-body-sm text-on-surface-variant">I agree to ZPPSU's <a href="#" class="text-primary hover:underline">Privacy &amp; Data Handling Policy</a> and consent to local AI processing of meeting data.</span>
        </label>
      </div>
      <div id="reg-error" class="md:col-span-2 hidden text-error bg-error-container p-sm rounded-lg font-body-sm flex items-center gap-xs"></div>
      <button type="submit" class="md:col-span-2 bg-primary text-on-primary font-body-md font-semibold py-md rounded-lg shadow-primary-md hover:opacity-90 transition flex items-center justify-center gap-sm">
        Create Account <span class="material-symbols-outlined">arrow_forward</span>
      </button>
      <p class="md:col-span-2 text-center font-body-sm text-on-surface-variant">Already have an account? <a href="login.html" class="text-primary font-semibold hover:underline">Sign in</a></p>
    </form>
  </div>
</div>

<script>
  (function() {
    const u = SmartMin.getCurrentUser();
    if (u) location.href = SmartMin.resolvePath(SmartMin.ROLE_DASHBOARDS[u.role]);

    const deptSel = document.getElementById('department');
    SMStore.listAll(SMStore.KEYS.departments).forEach(d => {
      deptSel.innerHTML += `<option value="${d.id}">${d.short} - ${d.name}</option>`;
    });
  })();

  document.getElementById('reg-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const err = document.getElementById('reg-error');
    err.classList.add('hidden');
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim().toLowerCase();
    const role = document.getElementById('role').value;
    const departmentId = document.getElementById('department').value;
    const position = document.getElementById('position').value.trim();
    const pw1 = document.getElementById('password').value;
    const pw2 = document.getElementById('password2').value;

    if (pw1 !== pw2) {
      err.classList.remove('hidden');
      err.innerHTML = '<span class="material-symbols-outlined text-[18px]">error</span> Passwords do not match.';
      return;
    }
    const exists = SMStore.listAll(SMStore.KEYS.users).find(u => u.email.toLowerCase() === email);
    if (exists) {
      err.classList.remove('hidden');
      err.innerHTML = '<span class="material-symbols-outlined text-[18px]">error</span> An account with this email already exists.';
      return;
    }

    const newUser = {
      id: SmartMin.uid('u'),
      name, email, role, departmentId, position,
      password: pw1,
      active: role !== 'admin',  // admins need approval in this demo
      joinedAt: new Date().toISOString().slice(0,10),
    };
    SMStore.upsert(SMStore.KEYS.users, newUser);
    SMStore.audit('user_registered', `${name} (${role}) self-registered`);

    if (!newUser.active) {
      err.classList.remove('hidden');
      err.className = 'md:col-span-2 text-tertiary-container bg-tertiary-fixed p-sm rounded-lg font-body-sm flex items-center gap-xs';
      err.innerHTML = '<span class="material-symbols-outlined text-[18px]">hourglass_top</span> Account created. Administrator approval pending.';
      setTimeout(() => location.href = 'login.html', 2500);
      return;
    }
    SmartMin.setCurrentUser(newUser);
    location.href = SmartMin.resolvePath(SmartMin.ROLE_DASHBOARDS[newUser.role]);
  });
</script>

</body>
</html>
