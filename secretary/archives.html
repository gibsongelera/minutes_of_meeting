<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Meeting Archives | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/summarizer.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="mb-lg">
    <h1 class="font-h1 text-h1 flex items-center gap-sm"><span class="material-symbols-outlined text-primary text-[36px]">history_edu</span> Meeting Archives</h1>
    <p class="font-body-md text-on-surface-variant">Folder-organized library of past meetings with transcripts, minutes, and auto-generated filenames.</p>
  </header>

  <!-- Filter bar -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md mb-md flex flex-col md:flex-row gap-sm">
    <div class="relative flex-1">
      <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
      <input id="search" oninput="render()" placeholder="Search title, venue, project, or speaker" class="w-full pl-xl pr-md py-sm bg-surface-container border-transparent focus:border-primary rounded-lg"/>
    </div>
    <select id="filter-status" onchange="render()" class="bg-surface-container border-transparent focus:border-primary rounded-lg py-sm px-md">
      <option value="">All Status</option>
      <option value="scheduled">Scheduled</option>
      <option value="transcribed">Transcribed</option>
      <option value="pending_approval">Pending</option>
      <option value="approved">Approved</option>
      <option value="archived">Archived</option>
    </select>
    <select id="filter-ai" onchange="render()" class="bg-surface-container border-transparent focus:border-primary rounded-lg py-sm px-md">
      <option value="">All</option><option value="ai">AI Processed Only</option>
    </select>
  </div>

  <!-- Type tabs -->
  <div class="flex gap-xs border-b border-outline-variant mb-md flex-wrap">
    <button data-tab="all"      class="px-md py-sm rounded-t-lg font-label-caps text-label-caps border-b-2 border-primary text-primary">All</button>
    <button data-tab="regular"  class="px-md py-sm rounded-t-lg font-label-caps text-label-caps border-b-2 border-transparent text-on-surface-variant hover:text-primary">Regular</button>
    <button data-tab="capstone" class="px-md py-sm rounded-t-lg font-label-caps text-label-caps border-b-2 border-transparent text-on-surface-variant hover:text-primary">Capstone</button>
    <button data-tab="research" class="px-md py-sm rounded-t-lg font-label-caps text-label-caps border-b-2 border-transparent text-on-surface-variant hover:text-primary">Research</button>
  </div>

  <!-- Sub-type chips for capstone/research -->
  <div id="sub-chips" class="hidden flex-wrap gap-xs mb-md"></div>

  <div id="folder-view" class="space-y-lg"></div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'secretary', title: 'Meeting Archives' });
  if (!user) throw 'redirect';

  let activeTab = 'all';
  let activeSub = '';
  const taxonomy = SMStore.getTaxonomy();

  document.querySelectorAll('[data-tab]').forEach(b => {
    b.addEventListener('click', () => {
      activeTab = b.dataset.tab;
      activeSub = '';
      document.querySelectorAll('[data-tab]').forEach(x => {
        x.classList.remove('border-primary','text-primary');
        x.classList.add('border-transparent','text-on-surface-variant');
      });
      b.classList.add('border-primary','text-primary');
      b.classList.remove('border-transparent','text-on-surface-variant');
      renderSubChips();
      render();
    });
  });

  function renderSubChips() {
    const chipBar = document.getElementById('sub-chips');
    if (activeTab !== 'capstone' && activeTab !== 'research') {
      chipBar.classList.add('hidden');
      chipBar.innerHTML = '';
      return;
    }
    chipBar.classList.remove('hidden');
    chipBar.classList.add('flex');
    const subs = ['', ...(taxonomy[activeTab] || [])];
    chipBar.innerHTML = subs.map(s => `
      <button data-sub="${SmartMin.escapeHtml(s)}" class="pill ${activeSub === s ? 'pill-capstone ring-2 ring-primary' : 'pill-pending'} hover:opacity-80">${s || 'All sub-types'}</button>
    `).join('');
    chipBar.querySelectorAll('[data-sub]').forEach(b => b.addEventListener('click', () => {
      activeSub = b.dataset.sub;
      renderSubChips();
      render();
    }));
  }

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const fs = document.getElementById('filter-status').value;
    const fa = document.getElementById('filter-ai').value;
    let list = SMStore.scopeMeetings(user, SMStore.listAll(SMStore.KEYS.meetings));
    if (q) list = list.filter(m => (`${m.title} ${m.venue||''} ${m.projectTitle||''}`).toLowerCase().includes(q));
    if (fs) list = list.filter(m => m.status === fs);
    if (fa) list = list.filter(m => m.aiProcessed);
    if (activeTab !== 'all') list = list.filter(m => (m.meetingType || 'regular') === activeTab);
    if (activeSub) list = list.filter(m => m.subType === activeSub);

    const grouped = groupByFolder(list);
    const folderView = document.getElementById('folder-view');

    if (!list.length) {
      folderView.innerHTML = '<p class="col-span-full text-on-surface-variant text-center py-xl">No archived meetings match the current filters.</p>';
      return;
    }

    folderView.innerHTML = Object.keys(grouped).map(folderKey => {
      const items = grouped[folderKey];
      return `
        <section>
          <h3 class="font-h3 text-h3 mb-sm flex items-center gap-sm">
            <span class="material-symbols-outlined text-primary">folder</span>
            ${SmartMin.escapeHtml(folderKey)}
            <span class="font-caption text-caption text-on-surface-variant">(${items.length})</span>
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md">
            ${items.map(card).join('')}
          </div>
        </section>
      `;
    }).join('');
  }
  window.render = render;

  function groupByFolder(list) {
    const buckets = {};
    list.forEach(m => {
      const t = m.meetingType || 'regular';
      let key;
      if (t === 'regular') key = 'Regular Meetings';
      else if (t === 'capstone') key = `Capstone / ${m.subType || 'Other'}`;
      else if (t === 'research') key = `Research / ${m.subType || 'Other'}`;
      else key = 'Other';
      (buckets[key] = buckets[key] || []).push(m);
    });
    // sort folders alphabetically but Regular always last
    const keys = Object.keys(buckets).sort((a, b) => {
      if (a === 'Regular Meetings') return 1;
      if (b === 'Regular Meetings') return -1;
      return a.localeCompare(b);
    });
    const ordered = {};
    keys.forEach(k => ordered[k] = buckets[k].sort((a,b)=>new Date(b.date)-new Date(a.date)));
    return ordered;
  }

  function card(m) {
    const transcript = SMStore.listAll(SMStore.KEYS.transcripts).find(t => t.meetingId === m.id);
    const tasks = SMStore.listAll(SMStore.KEYS.tasks).filter(t => t.meetingId === m.id);
    const min = SMStore.listAll(SMStore.KEYS.minutes).find(x => x.meetingId === m.id);
    const pillCls = m.status === 'approved' ? 'pill-done' : m.status === 'pending_approval' ? 'pill-progress' : 'pill-pending';
    const type = m.meetingType || 'regular';
    const typePill = type === 'capstone' ? 'pill-capstone' : type === 'research' ? 'pill-research' : 'pill-regular';
    const locked = !!(min && min.lockedAt);
    const filename = SMSummarizer.fileNameFor(m);
    return `
      <div class="folder-card">
        <div class="flex items-start justify-between mb-md">
          <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center"><span class="material-symbols-outlined">${type==='capstone'?'school':type==='research'?'science':'history_edu'}</span></div>
          <div class="flex flex-col items-end gap-xs">
            <span class="pill ${typePill}">${type[0].toUpperCase()+type.slice(1)}${m.subType?` · ${SmartMin.escapeHtml(m.subType)}`:''}</span>
            <span class="pill ${pillCls}">${m.status.replace('_',' ')}</span>
            ${locked ? '<span class="pill pill-locked"><span class="material-symbols-outlined text-[12px]">lock</span> LOCKED</span>' : ''}
            ${m.aiProcessed ? '<span class="pill pill-ai">AI</span>' : ''}
          </div>
        </div>
        <h3 class="font-h3 text-h3 mb-xs">${SmartMin.escapeHtml(m.title)}</h3>
        ${m.projectTitle ? `<p class="font-body-sm text-tertiary mb-xs"><span class="material-symbols-outlined text-[14px] align-middle">school</span> ${SmartMin.escapeHtml(m.projectTitle)}</p>` : ''}
        <p class="font-caption text-caption text-on-surface-variant mb-md">${SmartMin.fmtDate(m.date, true)}</p>
        ${transcript?.summary ? `<div class="bg-tertiary-fixed/30 border-l-4 border-tertiary-container rounded-r-lg p-sm mb-md"><p class="font-caption text-caption text-on-surface line-clamp-3">${SmartMin.escapeHtml(transcript.summary)}</p></div>` : ''}

        <div class="bg-surface-container-low border border-outline-variant rounded-lg p-xs mb-md flex items-center gap-xs">
          <span class="material-symbols-outlined text-[14px] text-on-surface-variant">draft</span>
          <code class="font-caption text-caption truncate flex-1" title="${SmartMin.escapeHtml(filename)}">${SmartMin.escapeHtml(filename)}.pdf</code>
        </div>

        <div class="grid grid-cols-3 gap-sm pt-md border-t border-outline-variant text-center">
          <div><p class="font-h3 text-h3 text-primary">${transcript?.segments?.length || 0}</p><p class="font-caption text-caption text-on-surface-variant">Segments</p></div>
          <div><p class="font-h3 text-h3 text-tertiary-container">${tasks.length}</p><p class="font-caption text-caption text-on-surface-variant">Tasks</p></div>
          <div><p class="font-h3 text-h3 text-success">${m.durationMin||0}m</p><p class="font-caption text-caption text-on-surface-variant">Duration</p></div>
        </div>
        <div class="flex gap-xs mt-md">
          <a href="transcript.html?m=${m.id}" class="flex-1 border border-outline-variant px-sm py-xs rounded-lg hover:bg-surface-container text-body-sm text-center">Transcript</a>
          <a href="mom-editor.html?m=${m.id}" class="flex-1 bg-primary text-on-primary px-sm py-xs rounded-lg shadow-primary-md text-body-sm text-center">Document</a>
        </div>
      </div>
    `;
  }

  render();
</script>

</body>
</html>
