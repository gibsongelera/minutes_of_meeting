<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transcript Editor | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/translator.js"></script>
<script src="../assets/js/summarizer.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex items-center justify-between flex-wrap gap-md mb-md">
    <div>
      <h1 class="font-h1 text-h1">Transcript Editor</h1>
      <p class="font-body-md text-on-surface-variant" id="meta">—</p>
    </div>
    <div class="flex gap-sm flex-wrap">
      <select id="t-select" onchange="loadTranscript(this.value)" class="bg-surface-container border-transparent focus:border-primary rounded-lg py-sm px-md"></select>
      <button onclick="toggleTranslate()" class="bg-tertiary-container/20 border border-tertiary-container/30 text-tertiary-container px-md py-sm rounded-lg flex items-center gap-xs font-semibold" id="btn-translate"><span class="material-symbols-outlined text-[18px]">translate</span> <span id="trans-label">Translate to Tagalog</span></button>
      <button onclick="saveTranscript()" class="bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">save</span> Save Changes</button>
    </div>
  </header>

  <div class="grid grid-cols-12 gap-md">
    <!-- Transcript -->
    <section class="col-span-12 lg:col-span-8 bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <div class="flex items-center justify-between mb-md pb-sm border-b border-outline-variant">
        <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="material-symbols-outlined text-primary">closed_caption</span> Transcript</h3>
        <span id="t-lang-badge" class="pill pill-ai">EN</span>
      </div>
      <div id="segments" class="space-y-md max-h-[600px] overflow-y-auto pr-sm"></div>
    </section>

    <!-- AI Summary -->
    <aside class="col-span-12 lg:col-span-4 space-y-md">
      <div class="glass-panel rounded-xl p-md">
        <h3 class="font-h3 text-h3 flex items-center gap-sm mb-md"><span class="material-symbols-outlined text-tertiary-container">auto_awesome</span> AI Summary</h3>
        <p id="summary" class="font-body-md text-on-surface mb-md">—</p>
        <button onclick="regenerateSummary()" class="w-full border border-tertiary-container/40 bg-tertiary-fixed text-on-tertiary-fixed-variant px-md py-sm rounded-lg hover:bg-tertiary-container/30 flex items-center justify-center gap-xs font-semibold"><span class="material-symbols-outlined text-[18px]">refresh</span> Regenerate</button>
      </div>

      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
        <h3 class="font-h3 text-h3 flex items-center gap-sm mb-md"><span class="material-symbols-outlined text-primary">task_alt</span> Detected Action Items</h3>
        <div id="actions" class="space-y-sm"></div>
      </div>

      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
        <h3 class="font-h3 text-h3 mb-md">Quick Actions</h3>
        <div class="space-y-xs">
          <a id="link-mom" href="#" class="block bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md text-center flex items-center justify-center gap-xs"><span class="material-symbols-outlined text-[18px]">description</span> Generate Document</a>
          <button onclick="exportTxt()" class="w-full border border-outline-variant px-md py-sm rounded-lg hover:bg-surface-container flex items-center justify-center gap-xs"><span class="material-symbols-outlined text-[18px]">file_download</span> Export as .txt</button>
        </div>
      </div>

      <div class="comments-panel bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
        <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-primary">forum</span> Comments</h3>
        <div id="comments-list" class="space-y-sm mb-md max-h-[260px] overflow-y-auto pr-xs"></div>
        <form id="comment-form" class="space-y-sm">
          <textarea id="comment-input" rows="2" placeholder="Add a comment for participants..." class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" required></textarea>
          <input id="comment-parent" type="hidden"/>
          <div class="flex items-center justify-between">
            <span id="reply-target" class="font-caption text-caption text-on-surface-variant"></span>
            <button type="submit" class="px-md py-sm rounded-lg bg-primary text-on-primary shadow-primary-md font-label-caps text-label-caps">Post</button>
          </div>
        </form>
      </div>
    </aside>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'secretary', title: 'Transcript Editor' });
  if (!user) throw 'redirect';

  const transcripts = SMStore.listAll(SMStore.KEYS.transcripts);
  let currentT = null;
  let originalSegments = null;
  let translatedSegments = null;
  let isTranslated = false;

  // Build picker
  const meetings = SMStore.listAll(SMStore.KEYS.meetings);
  document.getElementById('t-select').innerHTML = transcripts.map(t => {
    const m = meetings.find(mm => mm.id === t.meetingId);
    return `<option value="${t.id}">${m ? SmartMin.escapeHtml(m.title) : 'Ad-hoc transcript'} (${t.language})</option>`;
  }).join('') || '<option value="">No transcripts available</option>';

  // Determine which transcript to load
  const q = new URLSearchParams(location.search);
  const mid = q.get('m');
  const tid = q.get('t');
  let initial = tid ? transcripts.find(t => t.id === tid)
                    : mid ? transcripts.find(t => t.meetingId === mid)
                          : transcripts[0];

  if (initial) {
    document.getElementById('t-select').value = initial.id;
    loadTranscript(initial.id);
  } else {
    document.getElementById('segments').innerHTML = '<p class="text-center text-on-surface-variant py-xl">No transcripts yet. Record a meeting or upload audio to generate one.</p>';
  }

  function loadTranscript(id) {
    currentT = SMStore.getById(SMStore.KEYS.transcripts, id);
    if (!currentT) return;
    originalSegments = JSON.parse(JSON.stringify(currentT.segments));
    translatedSegments = null;
    isTranslated = false;
    document.getElementById('trans-label').textContent = currentT.language === 'tl-PH' ? 'Translate to English' : 'Translate to Tagalog';
    document.getElementById('t-lang-badge').textContent = currentT.language === 'tl-PH' ? 'TL' : 'EN';

    const m = meetings.find(mm => mm.id === currentT.meetingId);
    document.getElementById('meta').textContent = m
      ? `${m.title} · ${SmartMin.fmtDate(m.date, true)}`
      : `Ad-hoc transcript · ${SmartMin.fmtDate(currentT.createdAt || Date.now(), true)}`;
    document.getElementById('link-mom').href = m ? `mom-editor.html?m=${m.id}` : 'mom-editor.html';

    renderSegments(originalSegments);
    document.getElementById('summary').textContent = currentT.summary || '—';
    renderActions();
    renderComments();
  }
  window.loadTranscript = loadTranscript;

  function renderSegments(segs) {
    document.getElementById('segments').innerHTML = segs.map((s, i) => `
      <div class="border-l-2 border-${s.speaker?.includes('Gomez')||s.speaker?.includes('Live')?'primary':'outline-variant'} pl-md py-sm ${s.speaker?.includes('Gomez')||s.speaker?.includes('Live')?'bg-primary/5 rounded-r-lg':''}">
        <div class="flex items-center gap-sm mb-xs">
          <input class="font-label-caps text-label-caps bg-transparent border-0 focus:bg-surface-container-low focus:ring-1 focus:ring-primary rounded text-${s.speaker?.includes('Gomez')||s.speaker?.includes('Live')?'primary':'on-surface-variant'} font-semibold w-auto" value="${SmartMin.escapeHtml(s.speaker || '—')}" onchange="updateSpeaker(${i}, this.value)"/>
          <span class="font-caption text-caption text-on-surface-variant">${SmartMin.fmtTime(s.t)}</span>
          ${s.confidence ? `<span class="font-caption text-caption text-on-surface-variant ml-auto">${Math.round((s.confidence||0)*100)}%</span>` : ''}
        </div>
        <textarea class="w-full bg-transparent border-0 focus:bg-surface-container-low focus:ring-1 focus:ring-primary rounded p-sm font-body-md text-on-surface" rows="2" onchange="updateText(${i}, this.value)" oninput="autoResize(this)">${SmartMin.escapeHtml(s.text)}</textarea>
      </div>
    `).join('');
    document.querySelectorAll('textarea').forEach(t => autoResize(t));
  }

  function autoResize(el) { el.style.height = 'auto'; el.style.height = (el.scrollHeight + 4) + 'px'; }
  function updateSpeaker(i, v) { currentT.segments[i].speaker = v; if (originalSegments && !isTranslated) originalSegments[i].speaker = v; }
  function updateText(i, v) { currentT.segments[i].text = v; if (originalSegments && !isTranslated) originalSegments[i].text = v; }
  window.updateSpeaker = updateSpeaker; window.updateText = updateText; window.autoResize = autoResize;

  function toggleTranslate() {
    if (!currentT) return;
    if (isTranslated) {
      isTranslated = false;
      renderSegments(originalSegments);
      currentT.segments = JSON.parse(JSON.stringify(originalSegments));
      document.getElementById('t-lang-badge').textContent = currentT.language === 'tl-PH' ? 'TL' : 'EN';
      document.getElementById('trans-label').textContent = currentT.language === 'tl-PH' ? 'Translate to English' : 'Translate to Tagalog';
      SmartMin.toast('Reverted to original transcript', 'success');
    } else {
      const direction = currentT.language === 'tl-PH' ? 'tl-en' : 'en-tl';
      translatedSegments = SMTranslator.translateSegments(originalSegments, direction);
      renderSegments(translatedSegments);
      currentT.segments = translatedSegments;
      isTranslated = true;
      document.getElementById('t-lang-badge').textContent = currentT.language === 'tl-PH' ? 'EN' : 'TL';
      document.getElementById('trans-label').textContent = 'Show Original';
      SmartMin.toast(`Translated to ${direction === 'en-tl' ? 'Tagalog' : 'English'}`, 'ai');
      SMStore.audit('transcript_translated', `${currentT.id} - ${direction}`);
    }
  }
  window.toggleTranslate = toggleTranslate;

  function renderActions() {
    if (!currentT) return;
    const actions = SMSummarizer.extractActionItems(originalSegments || currentT.segments);
    document.getElementById('actions').innerHTML = actions.length === 0
      ? '<p class="font-body-sm text-on-surface-variant italic">No action items detected.</p>'
      : actions.slice(0, 5).map(a => `
        <div class="p-sm bg-tertiary-fixed/40 rounded-lg border-l-4 border-tertiary-container">
          <p class="font-body-sm">${SmartMin.escapeHtml(a.text.length>120?a.text.slice(0,117)+'...':a.text)}</p>
          <div class="flex gap-sm mt-xs">
            ${a.assignee ? `<span class="font-caption text-caption text-on-surface-variant"><span class="material-symbols-outlined text-[12px]">person</span>${SmartMin.escapeHtml(a.assignee)}</span>` : ''}
            ${a.deadline ? `<span class="font-caption text-caption text-on-surface-variant"><span class="material-symbols-outlined text-[12px]">schedule</span>${SmartMin.escapeHtml(a.deadline)}</span>` : ''}
            <span class="font-caption text-caption text-tertiary-container ml-auto">${Math.round(a.confidence*100)}%</span>
          </div>
        </div>
      `).join('');
  }

  function regenerateSummary() {
    if (!currentT) return;
    const summary = SMSummarizer.summarizeSegments(originalSegments || currentT.segments, 4);
    currentT.summary = summary;
    document.getElementById('summary').textContent = summary;
    SmartMin.toast('Summary regenerated with AI', 'ai');
  }
  window.regenerateSummary = regenerateSummary;

  function saveTranscript() {
    if (!currentT) return;
    // Save the ORIGINAL (untranslated) version with any speaker/text edits
    const toSave = { ...currentT, segments: originalSegments || currentT.segments };
    SMStore.upsert(SMStore.KEYS.transcripts, toSave);
    SMStore.audit('transcript_edited', currentT.id);
    SmartMin.toast('Transcript saved', 'success');
  }
  window.saveTranscript = saveTranscript;

  function exportTxt() {
    if (!currentT) return;
    const text = currentT.segments.map(s => `[${SmartMin.fmtTime(s.t)}] ${s.speaker}: ${s.text}`).join('\n\n');
    const summary = currentT.summary ? `\n\n=== SUMMARY ===\n${currentT.summary}` : '';
    const blob = new Blob([text + summary], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `transcript-${currentT.id}.txt`; a.click();
  }
  window.exportTxt = exportTxt;

  // -------- Comments --------
  function renderComments() {
    const wrap = document.getElementById('comments-list');
    if (!currentT) { wrap.innerHTML = ''; return; }
    const all = currentT.comments || [];
    const users = SMStore.listAll(SMStore.KEYS.users);
    if (!all.length) { wrap.innerHTML = '<p class="text-on-surface-variant italic font-body-sm">No comments yet. Be the first.</p>'; return; }
    const roots = all.filter(c => !c.parentId);
    function render(c, isReply) {
      const u = users.find(x => x.id === c.userId);
      const replies = all.filter(r => r.parentId === c.id);
      return `
        <div class="comment ${isReply?'reply':''}">
          <div class="flex gap-sm">
            ${SmartMin.avatarMarkup(u || { name: c.name }, 'w-8 h-8 text-[11px]')}
            <div class="flex-1 min-w-0">
              <div class="flex items-baseline gap-sm">
                <p class="font-body-sm font-semibold truncate">${SmartMin.escapeHtml(c.name)}</p>
                <p class="font-caption text-caption text-on-surface-variant">${SmartMin.fmtDate(c.ts, true)}</p>
              </div>
              <p class="font-body-sm whitespace-pre-wrap">${SmartMin.escapeHtml(c.text)}</p>
              <button type="button" class="text-primary font-label-caps text-label-caps mt-xs" onclick="replyTo('${c.id}','${SmartMin.escapeHtml(c.name).replace(/'/g,"\\'")}')">Reply</button>
            </div>
          </div>
          ${replies.map(r => render(r, true)).join('')}
        </div>
      `;
    }
    wrap.innerHTML = roots.map(c => render(c, false)).join('');
  }

  function replyTo(id, name) {
    document.getElementById('comment-parent').value = id;
    document.getElementById('reply-target').textContent = `Replying to ${name}`;
    document.getElementById('comment-input').focus();
  }
  window.replyTo = replyTo;

  document.getElementById('comment-form').addEventListener('submit', e => {
    e.preventDefault();
    if (!currentT) return;
    const text = document.getElementById('comment-input').value.trim();
    if (!text) return;
    const parentId = document.getElementById('comment-parent').value || null;
    currentT.comments = currentT.comments || [];
    const c = { id: SmartMin.uid('c'), ts: Date.now(), userId: user.id, name: user.name, text, parentId };
    currentT.comments.push(c);
    SMStore.upsert(SMStore.KEYS.transcripts, currentT);
    SMStore.audit('comment_posted', `Transcript comment by ${user.name} on ${currentT.id}`);

    // Notify the meeting's participants (faculty) that there's a new comment
    const m = meetings.find(mm => mm.id === currentT.meetingId);
    (m?.participantIds || []).forEach(pid => {
      if (pid !== user.id) {
        SMStore.pushNotification({ userId: pid, type: 'task', title: 'New comment on transcript', body: `${user.name}: ${text.slice(0, 80)}` });
      }
    });

    document.getElementById('comment-input').value = '';
    document.getElementById('comment-parent').value = '';
    document.getElementById('reply-target').textContent = '';
    SmartMin.toast('Comment posted.', 'success');
    renderComments();
  });
</script>

</body>
</html>
