<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>User Management | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex flex-col md:flex-row md:items-end justify-between gap-md mb-lg">
    <div>
      <h1 class="font-h1 text-h1">User Management</h1>
      <p class="font-body-md text-on-surface-variant">Unified view across every role and department in ZPPSU.</p>
    </div>
    <button onclick="openUserModal()" class="bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md hover:opacity-90 flex items-center gap-xs">
      <span class="material-symbols-outlined text-[18px]">person_add</span> Add User
    </button>
  </header>

  <!-- Filters -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md mb-md flex flex-col md:flex-row gap-sm">
    <div class="relative flex-1">
      <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
      <input id="search" oninput="render()" type="text" placeholder="Search by name or email" class="w-full pl-xl pr-md py-sm bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg"/>
    </div>
    <select id="filter-role" onchange="render()" class="bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg py-sm px-md">
      <option value="">All Roles</option>
      <option value="admin">Admin</option>
      <option value="head">Head / Dean</option>
      <option value="secretary">Secretary</option>
      <option value="faculty">Faculty</option>
    </select>
    <select id="filter-dept" onchange="render()" class="bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg py-sm px-md"></select>
    <select id="filter-status" onchange="render()" class="bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg py-sm px-md">
      <option value="">All Status</option>
      <option value="active">Active</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>

  <!-- Stats row -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-md mb-md" id="role-counts"></div>

  <!-- Users table -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-body-sm">
        <thead class="bg-surface-container-low border-b border-outline-variant"><tr>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Name</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Role</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Department</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Position</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Status</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant text-right">Actions</th>
        </tr></thead>
        <tbody id="users-body"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal: add/edit user -->
<div id="user-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-md">
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-2xl w-full max-w-[560px] overflow-hidden">
    <div class="px-lg py-md border-b border-outline-variant flex items-center justify-between bg-primary text-on-primary">
      <h3 class="font-h3 text-h3" id="modal-title">Add User</h3>
      <button onclick="closeUserModal()" class="text-on-primary hover:opacity-80"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="user-form" class="p-lg grid grid-cols-1 md:grid-cols-2 gap-md">
      <input type="hidden" id="m-id"/>
      <div class="md:col-span-2"><label class="block font-label-caps text-label-caps mb-xs">Full Name</label><input id="m-name" required class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg"/></div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Email</label><input id="m-email" type="email" required class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg"/></div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Position</label><input id="m-position" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg"/></div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Role</label>
        <select id="m-role" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg">
          <option value="faculty">Faculty</option><option value="secretary">Secretary</option><option value="head">Head / President</option><option value="admin">Admin</option>
        </select>
      </div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Department</label><select id="m-dept" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg"></select></div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Password</label><input id="m-password" type="text" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="Leave blank to keep current"/></div>
      <div><label class="flex items-center gap-xs mt-md"><input id="m-active" type="checkbox" class="rounded text-primary"/><span class="font-body-sm">Active account</span></label></div>
      <div class="md:col-span-2 flex justify-end gap-sm pt-md border-t border-outline-variant">
        <button type="button" onclick="closeUserModal()" class="px-md py-sm rounded-lg border border-outline-variant">Cancel</button>
        <button type="submit" class="px-md py-sm rounded-lg bg-primary text-on-primary shadow-primary-md flex items-center gap-xs">
          <span class="material-symbols-outlined text-[18px]">save</span> Save
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'admin', title: 'User Management' });
  if (!user) throw 'redirect';

  const departments = SMStore.listAll(SMStore.KEYS.departments);
  document.getElementById('m-dept').innerHTML = departments.map(d => `<option value="${d.id}">${d.short} - ${d.name}</option>`).join('');
  document.getElementById('filter-dept').innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${d.id}">${d.short}</option>`).join('');

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const fr = document.getElementById('filter-role').value;
    const fd = document.getElementById('filter-dept').value;
    const fs = document.getElementById('filter-status').value;
    let list = SMStore.listAll(SMStore.KEYS.users);
    if (q) list = list.filter(u => u.name.toLowerCase().includes(q) || u.email.toLowerCase().includes(q));
    if (fr) list = list.filter(u => u.role === fr);
    if (fd) list = list.filter(u => u.departmentId === fd);
    if (fs) list = list.filter(u => fs === 'active' ? u.active !== false : u.active === false);

    // Stats
    const all = SMStore.listAll(SMStore.KEYS.users);
    const counts = { admin: 0, head: 0, secretary: 0, faculty: 0 };
    all.forEach(u => { if (counts[u.role] != null) counts[u.role]++; });
    document.getElementById('role-counts').innerHTML = [
      { label: 'Administrators', icon: 'admin_panel_settings', value: counts.admin, tone: 'primary' },
      { label: 'Heads / Deans',  icon: 'stars',                value: counts.head,  tone: 'primary' },
      { label: 'Secretaries',    icon: 'edit_note',            value: counts.secretary, tone: 'tertiary' },
      { label: 'Faculty',        icon: 'school',               value: counts.faculty,   tone: 'tertiary' },
    ].map(c => `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md flex items-center gap-md">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center ${c.tone==='primary'?'bg-primary-fixed text-primary':'bg-tertiary-fixed text-on-tertiary-fixed-variant'}"><span class="material-symbols-outlined">${c.icon}</span></div>
        <div><p class="font-h2 text-h2 font-bold">${c.value}</p><p class="font-caption text-caption text-on-surface-variant">${c.label}</p></div>
      </div>
    `).join('');

    const body = document.getElementById('users-body');
    body.innerHTML = list.length === 0
      ? '<tr><td colspan="6" class="py-xl text-center text-on-surface-variant">No users match the current filters.</td></tr>'
      : list.map(u => {
          const dept = departments.find(d => d.id === u.departmentId);
          return `
          <tr class="border-b border-outline-variant hover:bg-surface-container-low">
            <td class="py-sm px-md flex items-center gap-sm">
              <div class="w-9 h-9 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold">${SmartMin.initials(u.name)}</div>
              <div><div class="font-semibold">${SmartMin.escapeHtml(u.name)}</div><div class="font-caption text-on-surface-variant">${SmartMin.escapeHtml(u.email)}</div></div>
            </td>
            <td class="py-sm px-md"><span class="capitalize px-sm py-xs rounded-full text-caption font-semibold bg-surface-container">${u.role}</span></td>
            <td class="py-sm px-md">${dept ? dept.short : '—'}</td>
            <td class="py-sm px-md text-on-surface-variant">${SmartMin.escapeHtml(u.position || '')}</td>
            <td class="py-sm px-md"><span class="pill ${u.active!==false?'pill-done':'pill-overdue'}">${u.active!==false?'Active':'Inactive'}</span></td>
            <td class="py-sm px-md text-right">
              <button onclick="editUser('${u.id}')" class="text-secondary hover:text-primary"><span class="material-symbols-outlined text-[20px]">edit</span></button>
              <button onclick="toggleActive('${u.id}')" class="text-secondary hover:text-primary"><span class="material-symbols-outlined text-[20px]">${u.active!==false?'block':'check_circle'}</span></button>
              <button onclick="deleteUser('${u.id}')" class="text-secondary hover:text-error"><span class="material-symbols-outlined text-[20px]">delete</span></button>
            </td>
          </tr>`;
        }).join('');
  }
  render();

  function openUserModal(u) {
    document.getElementById('modal-title').textContent = u ? 'Edit User' : 'Add User';
    document.getElementById('m-id').value = u?.id || '';
    document.getElementById('m-name').value = u?.name || '';
    document.getElementById('m-email').value = u?.email || '';
    document.getElementById('m-position').value = u?.position || '';
    document.getElementById('m-role').value = u?.role || 'faculty';
    document.getElementById('m-dept').value = u?.departmentId || departments[0]?.id || '';
    document.getElementById('m-password').value = '';
    document.getElementById('m-active').checked = u ? u.active !== false : true;
    document.getElementById('user-modal').classList.remove('hidden');
  }
  function closeUserModal(){ document.getElementById('user-modal').classList.add('hidden'); }
  function editUser(id){ openUserModal(SMStore.getById(SMStore.KEYS.users, id)); }
  function toggleActive(id) {
    const u = SMStore.getById(SMStore.KEYS.users, id);
    if (!u) return;
    u.active = u.active === false ? true : false;
    SMStore.upsert(SMStore.KEYS.users, u);
    SMStore.audit('user_status_changed', `${u.name} -> ${u.active?'Active':'Inactive'}`);
    SmartMin.toast(`${u.name} ${u.active?'reactivated':'deactivated'}`, 'success');
    render();
  }
  function deleteUser(id) {
    const u = SMStore.getById(SMStore.KEYS.users, id);
    if (!confirm(`Delete user "${u?.name}"? This cannot be undone.`)) return;
    SMStore.remove(SMStore.KEYS.users, id);
    SMStore.audit('user_deleted', u.name);
    SmartMin.toast('User deleted', 'success');
    render();
  }
  window.openUserModal = openUserModal; window.closeUserModal = closeUserModal; window.editUser = editUser; window.toggleActive = toggleActive; window.deleteUser = deleteUser; window.render = render;

  document.getElementById('user-form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('m-id').value;
    const existing = id ? SMStore.getById(SMStore.KEYS.users, id) : null;
    const u = {
      id: id || SmartMin.uid('u'),
      name: document.getElementById('m-name').value.trim(),
      email: document.getElementById('m-email').value.trim().toLowerCase(),
      position: document.getElementById('m-position').value.trim(),
      role: document.getElementById('m-role').value,
      departmentId: document.getElementById('m-dept').value,
      active: document.getElementById('m-active').checked,
      password: document.getElementById('m-password').value || existing?.password || 'changeme123',
      joinedAt: existing?.joinedAt || new Date().toISOString().slice(0,10),
    };
    SMStore.upsert(SMStore.KEYS.users, u);
    SMStore.audit(existing?'user_updated':'user_created', u.name);
    SmartMin.toast(`User ${existing?'updated':'added'}`, 'success');
    closeUserModal(); render();
  });
</script>

</body>
</html>
