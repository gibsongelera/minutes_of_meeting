<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>System Settings | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="mb-lg">
    <h1 class="font-h1 text-h1">System Settings</h1>
    <p class="font-body-md text-on-surface-variant">AI model configuration, institutional branding, and language defaults.</p>
  </header>

  <form id="settings-form" class="grid grid-cols-12 gap-md">
    <!-- AI Models -->
    <div class="col-span-12 lg:col-span-6 bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-tertiary-container">smart_toy</span> AI Models</h3>
      <div class="space-y-md">
        <div>
          <label class="block font-label-caps text-label-caps mb-xs">Transcription Engine</label>
          <select id="s-engine" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg">
            <option>Whisper-Large v3 (local)</option><option>Whisper-Medium (local)</option><option>Web Speech API (browser)</option>
          </select>
        </div>
        <div>
          <label class="block font-label-caps text-label-caps mb-xs">Summarization Model</label>
          <select id="s-summary" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg">
            <option>LLaMA 3 8B (local)</option><option>LLaMA 3 70B (local)</option><option>Extractive (rule-based)</option>
          </select>
        </div>
        <div>
          <label class="block font-label-caps text-label-caps mb-xs">Default Language</label>
          <select id="s-lang" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg">
            <option value="en-US">English (US)</option>
            <option value="tl-PH">Tagalog (Philippines)</option>
          </select>
        </div>
        <label class="flex items-center gap-xs"><input id="s-ai-enabled" type="checkbox" class="rounded text-primary"/><span class="font-body-sm">Enable AI features globally</span></label>
        <label class="flex items-center gap-xs"><input id="s-auto-transcribe" type="checkbox" class="rounded text-primary"/><span class="font-body-sm">Auto-transcribe new recordings</span></label>
        <label class="flex items-center gap-xs"><input id="s-auto-summary" type="checkbox" class="rounded text-primary"/><span class="font-body-sm">Auto-generate summaries</span></label>
      </div>
    </div>

    <!-- Institution branding -->
    <div class="col-span-12 lg:col-span-6 bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-primary">account_balance</span> Institutional Identity</h3>
      <div class="space-y-md">
        <div><label class="block font-label-caps text-label-caps mb-xs">Institution Name</label><input id="s-inst-name" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"/></div>
        <div><label class="block font-label-caps text-label-caps mb-xs">Short Code</label><input id="s-inst-short" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"/></div>
        <div class="p-md bg-tertiary-fixed/40 border-l-4 border-tertiary-container rounded-lg">
          <p class="font-body-sm flex items-center gap-xs"><span class="material-symbols-outlined text-tertiary-container">info</span> Changes apply to MoM headers, login pages, and exported reports.</p>
        </div>
      </div>
    </div>

    <!-- Save -->
    <div class="col-span-12 flex justify-end gap-sm">
      <button type="button" onclick="resetDemo()" class="border border-error text-error px-md py-sm rounded-lg hover:bg-error/10 flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">restart_alt</span> Reset Demo Data</button>
      <button type="submit" class="bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">save</span> Save Changes</button>
    </div>
  </form>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'admin', title: 'System Settings' });
  if (!user) throw 'redirect';

  const s = SMStore.getSettings();
  document.getElementById('s-engine').value = 'Whisper-Large v3 (local)';
  document.getElementById('s-summary').value = 'LLaMA 3 8B (local)';
  document.getElementById('s-lang').value = s.defaultLanguage || 'en-US';
  document.getElementById('s-ai-enabled').checked = s.aiEnabled;
  document.getElementById('s-auto-transcribe').checked = s.autoTranscribe;
  document.getElementById('s-auto-summary').checked = s.autoSummarize;
  document.getElementById('s-inst-name').value = s.institutionName;
  document.getElementById('s-inst-short').value = s.institutionShort;

  document.getElementById('settings-form').addEventListener('submit', e => {
    e.preventDefault();
    SMStore.setSettings({
      aiEnabled: document.getElementById('s-ai-enabled').checked,
      autoTranscribe: document.getElementById('s-auto-transcribe').checked,
      autoSummarize: document.getElementById('s-auto-summary').checked,
      defaultLanguage: document.getElementById('s-lang').value,
      institutionName: document.getElementById('s-inst-name').value,
      institutionShort: document.getElementById('s-inst-short').value,
    });
    SmartMin.toast('Settings saved', 'success');
  });

  function resetDemo() {
    if (!confirm('Reset all demo data to defaults? This signs you out.')) return;
    SMSeed.resetSeed();
    SmartMin.setCurrentUser(null);
    location.href = SmartMin.resolvePath('/login.html');
  }
  window.resetDemo = resetDemo;
</script>

</body>
</html>
