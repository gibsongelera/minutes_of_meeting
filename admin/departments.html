<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Departments &amp; Offices | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex flex-col md:flex-row md:items-end justify-between gap-md mb-lg">
    <div>
      <h1 class="font-h1 text-h1">Departments &amp; Offices</h1>
      <p class="font-body-md text-on-surface-variant">Manage institutional units, colleges, and administrative offices.</p>
    </div>
    <button onclick="openDeptModal()" class="bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md hover:opacity-90 flex items-center gap-xs">
      <span class="material-symbols-outlined text-[18px]">add_business</span> Add Department
    </button>
  </header>

  <!-- Cards grid -->
  <div id="dept-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md"></div>
</div>

<!-- Modal -->
<div id="dept-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-md">
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-2xl w-full max-w-[520px] overflow-hidden">
    <div class="px-lg py-md border-b border-outline-variant flex items-center justify-between bg-primary text-on-primary">
      <h3 class="font-h3 text-h3" id="dept-modal-title">Add Department</h3>
      <button onclick="closeDeptModal()" class="text-on-primary hover:opacity-80"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="dept-form" class="p-lg space-y-md">
      <input type="hidden" id="d-id"/>
      <div><label class="block font-label-caps text-label-caps mb-xs">Full Name</label><input id="d-name" required class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg"/></div>
      <div class="grid grid-cols-2 gap-md">
        <div><label class="block font-label-caps text-label-caps mb-xs">Short Code</label><input id="d-short" required class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="CICS"/></div>
        <div><label class="block font-label-caps text-label-caps mb-xs">Type</label><select id="d-type" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg"><option value="college">College</option><option value="office">Office</option><option value="department">Department</option></select></div>
      </div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Office Location</label><input id="d-loc" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg" placeholder="Bldg A, 4F"/></div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Head of Unit</label><select id="d-head" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary focus:ring-0 rounded-lg"></select></div>
      <div class="flex justify-end gap-sm pt-md border-t border-outline-variant">
        <button type="button" onclick="closeDeptModal()" class="px-md py-sm rounded-lg border border-outline-variant">Cancel</button>
        <button type="submit" class="px-md py-sm rounded-lg bg-primary text-on-primary shadow-primary-md flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">save</span> Save</button>
      </div>
    </form>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'admin', title: 'Departments & Offices' });
  if (!user) throw 'redirect';

  function render() {
    const depts = SMStore.listAll(SMStore.KEYS.departments);
    const users = SMStore.listAll(SMStore.KEYS.users);
    document.getElementById('d-head').innerHTML = '<option value="">— Not assigned —</option>' + users.filter(u => ['head','admin'].includes(u.role)).map(u => `<option value="${u.id}">${u.name}</option>`).join('');

    document.getElementById('dept-grid').innerHTML = depts.map(d => {
      const head = users.find(u => u.id === d.headId);
      const memberCount = users.filter(u => u.departmentId === d.id).length;
      const meetingCount = SMStore.listAll(SMStore.KEYS.meetings).filter(m => m.departmentId === d.id).length;
      const icon = d.type === 'college' ? 'school' : d.type === 'office' ? 'corporate_fare' : 'apartment';
      return `
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md relative overflow-hidden">
          <div class="absolute top-0 right-0 w-1 h-full bg-primary"></div>
          <div class="flex items-start justify-between mb-md">
            <div class="w-12 h-12 rounded-lg bg-primary text-on-primary flex items-center justify-center shadow-primary-md"><span class="material-symbols-outlined">${icon}</span></div>
            <div class="flex gap-xs">
              <button onclick="editDept('${d.id}')" class="text-secondary hover:text-primary"><span class="material-symbols-outlined text-[20px]">edit</span></button>
              <button onclick="deleteDept('${d.id}')" class="text-secondary hover:text-error"><span class="material-symbols-outlined text-[20px]">delete</span></button>
            </div>
          </div>
          <h3 class="font-h3 text-h3 text-on-surface mb-xs">${SmartMin.escapeHtml(d.short)}</h3>
          <p class="font-body-sm text-on-surface-variant mb-sm">${SmartMin.escapeHtml(d.name)}</p>
          <div class="space-y-xs text-body-sm">
            <p class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px] text-on-surface-variant">place</span>${SmartMin.escapeHtml(d.officeLocation || '—')}</p>
            <p class="flex items-center gap-xs"><span class="material-symbols-outlined text-[16px] text-on-surface-variant">person</span>${head ? SmartMin.escapeHtml(head.name) : '<em class="text-on-surface-variant">Head unassigned</em>'}</p>
          </div>
          <div class="grid grid-cols-2 gap-sm mt-md pt-md border-t border-outline-variant">
            <div><p class="font-h3 text-h3 text-primary">${memberCount}</p><p class="font-caption text-caption text-on-surface-variant">Members</p></div>
            <div><p class="font-h3 text-h3 text-primary">${meetingCount}</p><p class="font-caption text-caption text-on-surface-variant">Meetings</p></div>
          </div>
        </div>
      `;
    }).join('');
  }
  render();

  function openDeptModal(d) {
    document.getElementById('dept-modal-title').textContent = d ? 'Edit Department' : 'Add Department';
    document.getElementById('d-id').value = d?.id || '';
    document.getElementById('d-name').value = d?.name || '';
    document.getElementById('d-short').value = d?.short || '';
    document.getElementById('d-type').value = d?.type || 'college';
    document.getElementById('d-loc').value = d?.officeLocation || '';
    document.getElementById('d-head').value = d?.headId || '';
    document.getElementById('dept-modal').classList.remove('hidden');
  }
  function closeDeptModal(){ document.getElementById('dept-modal').classList.add('hidden'); }
  function editDept(id){ openDeptModal(SMStore.getById(SMStore.KEYS.departments, id)); }
  function deleteDept(id) {
    const d = SMStore.getById(SMStore.KEYS.departments, id);
    if (!confirm(`Delete "${d?.name}"?`)) return;
    SMStore.remove(SMStore.KEYS.departments, id);
    SMStore.audit('department_deleted', d.name);
    SmartMin.toast('Department deleted','success'); render();
  }
  window.openDeptModal = openDeptModal; window.closeDeptModal = closeDeptModal; window.editDept = editDept; window.deleteDept = deleteDept;

  document.getElementById('dept-form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('d-id').value;
    const d = {
      id: id || SmartMin.uid('dept'),
      name: document.getElementById('d-name').value.trim(),
      short: document.getElementById('d-short').value.trim(),
      type: document.getElementById('d-type').value,
      officeLocation: document.getElementById('d-loc').value.trim(),
      headId: document.getElementById('d-head').value,
    };
    SMStore.upsert(SMStore.KEYS.departments, d);
    SMStore.audit(id?'department_updated':'department_created', d.name);
    SmartMin.toast(`Department ${id?'updated':'added'}`,'success');
    closeDeptModal(); render();
  });
</script>

</body>
</html>
