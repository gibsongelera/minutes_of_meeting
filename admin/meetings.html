<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>All Meetings | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="mb-lg">
    <h1 class="font-h1 text-h1">All Meetings</h1>
    <p class="font-body-md text-on-surface-variant">Institution-wide meeting overview across every department.</p>
  </header>

  <!-- Filters -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md mb-md flex flex-col md:flex-row gap-sm">
    <div class="relative flex-1">
      <span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
      <input id="search" oninput="render()" placeholder="Search by title or venue" class="w-full pl-xl pr-md py-sm bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg"/>
    </div>
    <select id="filter-dept" onchange="render()" class="bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg py-sm px-md"></select>
    <select id="filter-type" onchange="render()" class="bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg py-sm px-md">
      <option value="">All Types</option>
      <option value="regular">Regular</option>
      <option value="capstone">Capstone</option>
      <option value="research">Research</option>
    </select>
    <select id="filter-status" onchange="render()" class="bg-surface-container border-transparent focus:border-primary focus:ring-0 rounded-lg py-sm px-md">
      <option value="">All Status</option>
      <option value="scheduled">Scheduled</option>
      <option value="transcribed">Transcribed</option>
      <option value="pending_approval">Pending Approval</option>
      <option value="approved">Approved</option>
      <option value="archived">Archived</option>
    </select>
  </div>

  <!-- Stats -->
  <div id="stats-row" class="grid grid-cols-2 md:grid-cols-5 gap-md mb-md"></div>

  <!-- Meetings list -->
  <div class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-left text-body-sm">
        <thead class="bg-surface-container-low border-b border-outline-variant"><tr>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Title</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Date</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Department</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Type</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Chair</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Status</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">AI</th>
        </tr></thead>
        <tbody id="meetings-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'admin', title: 'All Meetings' });
  if (!user) throw 'redirect';

  const departments = SMStore.listAll(SMStore.KEYS.departments);
  const users = SMStore.listAll(SMStore.KEYS.users);
  document.getElementById('filter-dept').innerHTML = '<option value="">All Departments</option>' + departments.map(d => `<option value="${d.id}">${d.short}</option>`).join('');

  const STATUS_PILL = {
    scheduled:        ['pill-pending',  'Scheduled'],
    transcribed:      ['pill-progress', 'Transcribed'],
    pending_approval: ['pill-progress', 'Pending Approval'],
    approved:         ['pill-done',     'Approved'],
    archived:         ['pill-pending',  'Archived'],
  };

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const fd = document.getElementById('filter-dept').value;
    const ft = document.getElementById('filter-type').value;
    const fs = document.getElementById('filter-status').value;
    let list = SMStore.listAll(SMStore.KEYS.meetings);
    if (q) list = list.filter(m => m.title.toLowerCase().includes(q) || (m.venue||'').toLowerCase().includes(q) || (m.projectTitle||'').toLowerCase().includes(q));
    if (fd) list = list.filter(m => m.departmentId === fd);
    if (ft) list = list.filter(m => (m.meetingType||'regular') === ft);
    if (fs) list = list.filter(m => m.status === fs);

    const allMinutes = SMStore.listAll(SMStore.KEYS.minutes);

    // Stats
    const all = SMStore.listAll(SMStore.KEYS.meetings);
    const buckets = { scheduled:0, transcribed:0, pending_approval:0, approved:0, archived:0 };
    all.forEach(m => buckets[m.status] = (buckets[m.status]||0)+1);
    document.getElementById('stats-row').innerHTML = [
      { label: 'Scheduled',        v: buckets.scheduled,        icon: 'event' },
      { label: 'Transcribed',      v: buckets.transcribed,      icon: 'closed_caption' },
      { label: 'Pending Approval', v: buckets.pending_approval, icon: 'pending_actions' },
      { label: 'Approved',         v: buckets.approved,         icon: 'verified' },
      { label: 'Archived',         v: buckets.archived,         icon: 'inventory_2' },
    ].map(s => `
      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md text-center">
        <span class="material-symbols-outlined text-primary text-[24px]">${s.icon}</span>
        <p class="font-h2 text-h2 font-bold mt-xs">${s.v}</p>
        <p class="font-caption text-caption text-on-surface-variant">${s.label}</p>
      </div>
    `).join('');

    document.getElementById('meetings-body').innerHTML = list.length === 0
      ? '<tr><td colspan="7" class="py-xl text-center text-on-surface-variant">No meetings match the filters.</td></tr>'
      : list.map(m => {
          const dept = departments.find(d => d.id === m.departmentId);
          const chair = users.find(u => u.id === m.chairId);
          const [cls, label] = STATUS_PILL[m.status] || ['pill-pending', m.status];
          const type = m.meetingType || 'regular';
          const typePill = type === 'capstone' ? 'pill-capstone' : type === 'research' ? 'pill-research' : 'pill-regular';
          const min = allMinutes.find(x => x.meetingId === m.id);
          const locked = !!(min && min.lockedAt);
          const amends = (min?.amendments||[]).length;
          return `
          <tr class="border-b border-outline-variant hover:bg-surface-container-low">
            <td class="py-sm px-md">
              <div class="font-semibold">${SmartMin.escapeHtml(m.title)}</div>
              ${m.projectTitle ? `<div class="font-caption text-tertiary">${SmartMin.escapeHtml(m.projectTitle)}</div>` : ''}
              <div class="font-caption text-on-surface-variant">${SmartMin.escapeHtml(m.venue || '')}</div>
            </td>
            <td class="py-sm px-md text-on-surface-variant">${SmartMin.fmtDate(m.date, true)}</td>
            <td class="py-sm px-md">${dept ? dept.short : '—'}</td>
            <td class="py-sm px-md"><span class="pill ${typePill}">${type[0].toUpperCase()+type.slice(1)}${m.subType?` · ${SmartMin.escapeHtml(m.subType)}`:''}</span></td>
            <td class="py-sm px-md">${chair ? SmartMin.escapeHtml(chair.name) : '—'}</td>
            <td class="py-sm px-md">
              <div class="flex flex-wrap gap-xs">
                <span class="pill ${cls}">${label}</span>
                ${locked ? '<span class="pill pill-locked"><span class="material-symbols-outlined text-[12px]">lock</span> LOCKED</span>' : ''}
                ${amends ? `<span class="pill pill-amend">${amends} amend${amends>1?'s':''}</span>` : ''}
              </div>
            </td>
            <td class="py-sm px-md">${m.aiProcessed ? '<span class="pill pill-ai">AI Processed</span>' : '<span class="text-on-surface-variant">—</span>'}</td>
          </tr>`;
        }).join('');
  }
  window.render = render;
  render();
</script>

</body>
</html>
