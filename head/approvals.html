<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Approvals &amp; Signing | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/summarizer.js"></script>
<script src="../assets/js/signature.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex items-center justify-between mb-lg flex-wrap gap-md">
    <div>
      <h1 class="font-h1 text-h1">Approvals &amp; Document Signing</h1>
      <p class="font-body-md text-on-surface-variant">Review AI-generated minutes, then digitally sign to approve.</p>
    </div>
    <div class="flex gap-sm">
      <button onclick="window.print()" class="border border-outline-variant px-md py-sm rounded-lg hover:bg-surface-container flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">print</span> Print / PDF</button>
    </div>
  </header>

  <div class="grid grid-cols-12 gap-md">
    <!-- Left: list -->
    <aside class="col-span-12 lg:col-span-4 bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden no-print">
      <div class="p-md border-b border-outline-variant"><h3 class="font-h3 text-h3">Queue</h3></div>
      <div id="queue-list" class="divide-y divide-outline-variant max-h-[600px] overflow-y-auto"></div>
    </aside>

    <!-- Right: document -->
    <section class="col-span-12 lg:col-span-8" id="doc-area"></section>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'head', title: 'Approvals' });
  if (!user) throw 'redirect';

  const meetings = SMStore.scopeMeetings(user, SMStore.listAll(SMStore.KEYS.meetings));
  const minutes = SMStore.listAll(SMStore.KEYS.minutes);
  const queue = meetings.filter(m => ['pending_approval','approved'].includes(m.status));

  let activeId = new URLSearchParams(location.search).get('m') || queue[0]?.id;

  function renderQueue() {
    document.getElementById('queue-list').innerHTML = queue.length === 0
      ? '<p class="p-md text-on-surface-variant">No documents in queue.</p>'
      : queue.map(m => {
          const active = m.id === activeId;
          const min = minutes.find(x => x.meetingId === m.id);
          const signed = (min?.signatures || []).some(s => s.userId === user.id);
          return `
            <button onclick="selectMeeting('${m.id}')" class="w-full text-left p-md hover:bg-surface-container-low ${active?'bg-primary-fixed/40 border-l-4 border-primary':''}">
              <p class="font-body-md font-semibold ${active?'text-primary':''}">${SmartMin.escapeHtml(m.title)}</p>
              <p class="font-caption text-caption text-on-surface-variant">${SmartMin.fmtDate(m.date)}</p>
              <div class="mt-xs flex gap-xs">
                ${m.status === 'approved' ? '<span class="pill pill-done">Approved</span>' : '<span class="pill pill-progress">Pending</span>'}
                ${signed ? '<span class="pill pill-done">Signed</span>' : ''}
              </div>
            </button>`;
        }).join('');
  }

  function selectMeeting(id) { activeId = id; renderQueue(); renderDoc(); }
  window.selectMeeting = selectMeeting;

  function renderDoc() {
    const m = meetings.find(x => x.id === activeId);
    if (!m) { document.getElementById('doc-area').innerHTML = '<p class="text-center text-on-surface-variant py-xl">Select a document from the queue.</p>'; return; }
    const min = minutes.find(x => x.meetingId === m.id);
    const dept = SMStore.listAll(SMStore.KEYS.departments).find(d => d.id === m.departmentId);
    const chair = SMStore.getById(SMStore.KEYS.users, m.chairId);
    const secretary = SMStore.getById(SMStore.KEYS.users, m.secretaryId);
    const sigSec = min?.signatures?.find(s => s.userId === m.secretaryId);
    const sigHead = min?.signatures?.find(s => s.userId === m.chairId);

    const docTitle = (min && min.documentTitle) ? min.documentTitle : SMSummarizer.docTitleFor(m);
    const locked = !!(min && min.lockedAt);
    const capstoneMeta = (m.meetingType === 'capstone' || m.meetingType === 'research') ? renderProjectMeta(m) : '';

    document.getElementById('doc-area').innerHTML = `
      ${locked ? `<div class="lock-banner mb-md no-print"><span class="material-symbols-outlined">lock</span><div><p class="font-semibold">This document is locked.</p><p class="font-caption text-caption text-on-surface-variant">Approved and locked on ${SmartMin.fmtDate(min.lockedAt, true)}. Secretary edits will require a re-approval.</p></div></div>` : ''}
      ${(min && Array.isArray(min.amendments) && min.amendments.length) ? `<div class="amend-banner mb-md no-print"><span class="material-symbols-outlined">history_edu</span><div><p class="font-semibold">${min.amendments.length} amendment${min.amendments.length>1?'s':''} on record.</p><p class="font-caption text-caption text-on-surface-variant">Latest: ${SmartMin.escapeHtml(min.amendments[min.amendments.length-1].summary)} - ${SmartMin.fmtDate(min.amendments[min.amendments.length-1].ts, true)}</p></div></div>` : ''}
      <div class="ched-doc">
        <div class="text-center border-b-2 border-primary pb-md mb-lg">
          <div class="w-16 h-16 mx-auto mb-sm rounded-full bg-primary text-on-primary flex items-center justify-center shadow-primary-md"><span class="material-symbols-outlined text-[28px]" style="font-variation-settings:'FILL' 1;">account_balance</span></div>
          <p class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest mb-xs">Zamboanga Peninsula Polytechnic State University</p>
          <h2 class="font-h2 text-h2 text-primary font-bold">${dept ? SmartMin.escapeHtml(dept.name.toUpperCase()) : 'OFFICE'}</h2>
          <h1 class="font-h1 text-h1 mt-sm">${SmartMin.escapeHtml(docTitle)}</h1>
          <h3 class="font-h3 text-h3 text-on-surface-variant mt-xs">${SmartMin.escapeHtml(m.title)}</h3>
        </div>
        <div class="grid grid-cols-2 gap-md mb-md text-body-md">
          <p><strong class="text-on-surface-variant">Date:</strong> ${SmartMin.fmtDate(m.date, true)}</p>
          <p><strong class="text-on-surface-variant">Venue:</strong> ${SmartMin.escapeHtml(m.venue||'—')}</p>
          <p><strong class="text-on-surface-variant">Presiding Officer:</strong> ${chair?SmartMin.escapeHtml(chair.name):'—'}</p>
          <p><strong class="text-on-surface-variant">Secretary:</strong> ${secretary?SmartMin.escapeHtml(secretary.name):'—'}</p>
        </div>
        ${capstoneMeta}

        <section class="mb-lg">
          <h3 class="font-h3 text-h3 text-primary mb-sm flex items-center gap-sm"><span class="material-symbols-outlined text-outline">gavel</span> 1. Call to Order &amp; Attendance</h3>
          <p>${SmartMin.escapeHtml(min?.callToOrder || 'Meeting called to order.')}</p>
        </section>

        <section class="mb-lg">
          <h3 class="font-h3 text-h3 text-primary mb-sm flex items-center gap-sm"><span class="material-symbols-outlined text-outline">history</span> 2. Approval of Previous Minutes</h3>
          <p>${SmartMin.escapeHtml(min?.previousMinutes || '—')}</p>
        </section>

        <section class="mb-xl">
          <h3 class="font-h3 text-h3 text-primary mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-outline">list_alt</span> 3. Agenda Items &amp; Discussions</h3>
          ${(min?.agendaItems || []).map(a => `
            <div class="glass-panel border-l-4 border-l-tertiary-container rounded-r-lg p-md mb-md">
              <div class="flex items-center gap-sm mb-xs">
                <h4 class="font-body-lg font-semibold">${SmartMin.escapeHtml(a.title)}</h4>
                <span class="ai-badge">AI Summarized</span>
              </div>
              <p>${SmartMin.escapeHtml(a.notes)}</p>
            </div>
          `).join('')}
        </section>

        <section class="mb-xl">
          <h3 class="font-h3 text-h3 text-primary mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-outline">assignment_turned_in</span> 4. Action Items</h3>
          <div class="overflow-x-auto"><table class="w-full text-left text-body-sm">
            <thead><tr class="border-b-2 border-outline-variant font-label-caps text-label-caps text-on-surface-variant uppercase">
              <th class="py-sm px-md">Task</th><th class="py-sm px-md">Assignee</th><th class="py-sm px-md">Deadline</th><th class="py-sm px-md">Status</th>
            </tr></thead><tbody>
              ${actionItemsFor(min, m)}
            </tbody></table></div>
        </section>

        <section class="mb-lg">
          <h3 class="font-h3 text-h3 text-primary mb-sm">5. Adjournment</h3>
          <p>${SmartMin.escapeHtml(min?.adjournment || '—')}</p>
        </section>

        <!-- Signatures -->
        <section class="mt-xxl pt-lg border-t border-outline-variant grid grid-cols-1 md:grid-cols-2 gap-xl">
          ${signatureBlock(sigSec, secretary, 'Faculty Secretary', m.id, 'secretary')}
          ${signatureBlock(sigHead, chair,     'Presiding Officer / Dean', m.id, 'head')}
        </section>

        ${m.status === 'approved' ? '<div class="mt-xl bg-success-container border-l-4 border-success rounded-lg p-md flex items-center gap-sm no-print"><span class="material-symbols-outlined text-success">verified</span><div><p class="font-semibold text-on-surface">This document is fully approved and locked.</p><p class="font-caption text-caption text-on-surface-variant">Use Print/PDF to export the final report.</p></div></div>' : ''}
      </div>
    `;
  }

  function renderProjectMeta(m) {
    const users = SMStore.listAll(SMStore.KEYS.users);
    const findName = id => users.find(u => u.id === id)?.name || '—';
    const panel = (m.panelMemberIds||[]).map(findName).join(', ') || '—';
    const chairperson = findName(m.chairpersonId);
    const adviser = findName(m.adviserId);
    const label = m.meetingType === 'capstone' ? 'Capstone' : 'Research';
    return `
      <div class="mb-xl bg-tertiary-fixed/30 border border-tertiary-container/40 rounded-lg p-md">
        <p class="font-label-caps text-label-caps text-tertiary mb-sm flex items-center gap-xs"><span class="material-symbols-outlined text-[16px]">school</span> ${label} Defense Details</p>
        <div class="grid grid-cols-2 gap-md text-body-sm">
          <p><strong class="text-on-surface-variant">Project Title:</strong> ${SmartMin.escapeHtml(m.projectTitle||'—')}</p>
          <p><strong class="text-on-surface-variant">Sub-Type:</strong> ${SmartMin.escapeHtml(m.subType||'—')}</p>
          ${m.meetingType === 'capstone' ? `<p><strong class="text-on-surface-variant">Chairperson:</strong> ${SmartMin.escapeHtml(chairperson)}</p>` : ''}
          <p><strong class="text-on-surface-variant">Adviser:</strong> ${SmartMin.escapeHtml(adviser)}</p>
          ${m.meetingType === 'capstone' ? `<p class="col-span-2"><strong class="text-on-surface-variant">Panel Members:</strong> ${SmartMin.escapeHtml(panel)}</p>` : ''}
        </div>
      </div>
    `;
  }

  function actionItemsFor(min, m) {
    if (!min) return '<tr><td colspan="4" class="p-md text-on-surface-variant">No action items captured.</td></tr>';
    const taskIds = min.actionItems || [];
    const tasks = SMStore.listAll(SMStore.KEYS.tasks).filter(t => taskIds.includes(t.id) || t.meetingId === m.id);
    if (tasks.length === 0) return '<tr><td colspan="4" class="p-md text-on-surface-variant">No action items captured.</td></tr>';
    const users = SMStore.listAll(SMStore.KEYS.users);
    return tasks.map(t => {
      const a = users.find(u => u.id === t.assigneeId);
      const pill = t.status === 'done' ? 'pill-done' : t.status === 'in_progress' ? 'pill-progress' : 'pill-pending';
      return `<tr class="border-b border-outline-variant/50">
        <td class="py-sm px-md font-medium">${SmartMin.escapeHtml(t.title)}</td>
        <td class="py-sm px-md">${a ? SmartMin.escapeHtml(a.name) : '<em class="text-on-surface-variant">Unassigned</em>'}</td>
        <td class="py-sm px-md">${t.deadline || '—'}</td>
        <td class="py-sm px-md"><span class="pill ${pill}">${t.status.replace('_',' ')}</span></td>
      </tr>`;
    }).join('');
  }

  function signatureBlock(sig, person, role, mid, who) {
    return `
      <div class="text-center">
        <div class="h-[80px] mb-xs flex items-end justify-center">
          ${sig?.dataUrl
            ? `<img src="${sig.dataUrl}" alt="signature" class="max-h-[70px]"/>`
            : (who === 'head'
                ? `<button onclick="sign('${mid}','head')" class="bg-surface border border-dashed border-primary text-primary px-md py-sm rounded-lg hover:bg-primary-fixed/20 flex items-center gap-xs no-print"><span class="material-symbols-outlined text-[16px]">draw</span> Click to Sign</button>`
                : '<span class="italic text-on-surface-variant text-body-sm">Pending secretary signature</span>')}
        </div>
        <div class="border-t border-on-surface-variant w-[80%] mx-auto pt-xs">
          <p class="font-body-md font-bold">${person ? SmartMin.escapeHtml(person.name) : '—'}</p>
          <p class="font-caption text-caption text-on-surface-variant">${role}</p>
          ${sig ? `<p class="font-caption text-caption text-on-surface-variant mt-xs">Signed ${SmartMin.fmtDate(sig.signedAt, true)}</p>` : ''}
        </div>
      </div>
    `;
  }

  function sign(mid, who) {
    SMSignature.openSignModal({
      title: 'Approve & Sign Minutes',
      subtitle: 'Your signature legally approves and locks this document.',
      onConfirm: (dataUrl) => {
        const min = minutes.find(x => x.meetingId === mid);
        if (!min) return;
        min.signatures = (min.signatures || []).filter(s => s.userId !== user.id);
        min.signatures.push({ userId: user.id, name: user.name, role: SmartMin.ROLE_LABEL[user.role], signedAt: Date.now(), dataUrl });

        const m = meetings.find(x => x.id === mid);
        if (m) {
          const haveSecSig = min.signatures.some(s => s.userId === m.secretaryId);
          const haveHeadSig = min.signatures.some(s => s.userId === m.chairId);
          if (haveSecSig && haveHeadSig) {
            m.status = 'approved'; min.status = 'approved';
            min.lockedAt = Date.now();
            min.lockedBy = user.id;
            if (m.secretaryId) {
              SMStore.pushNotification({
                userId: m.secretaryId,
                type: 'approval',
                title: 'Minutes approved and locked',
                body: `${m.title}: signed by ${user.name}. The document is now locked.`,
              });
            }
            SMStore.audit('minutes_locked', `${m.title} - locked by ${user.name}`);
          }
          SMStore.upsert(SMStore.KEYS.meetings, m);
        }
        SMStore.upsert(SMStore.KEYS.minutes, min);
        SMStore.audit('minutes_signed', `${meetings.find(x=>x.id===mid)?.title || ''} - signed by ${user.name}`);
        SmartMin.toast('Signature applied successfully.', 'success');
        renderDoc(); renderQueue();
      }
    });
  }
  window.sign = sign;

  renderQueue();
  renderDoc();
</script>

</body>
</html>
