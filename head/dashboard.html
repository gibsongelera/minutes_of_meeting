<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Head Dashboard | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex flex-col md:flex-row md:items-end justify-between gap-md mb-lg">
    <div>
      <h1 class="font-h1 text-h1" id="welcome">Department Overview</h1>
      <p class="font-body-lg text-on-surface-variant" id="dept-name">—</p>
    </div>
    <div class="flex gap-sm flex-wrap">
      <a href="approvals.html" class="bg-tertiary-container/20 border border-tertiary-container/30 text-tertiary-container px-md py-sm rounded-lg flex items-center gap-xs font-semibold">
        <span class="material-symbols-outlined text-[18px]">fact_check</span> Review Approvals
      </a>
      <a href="delegate.html" class="bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md flex items-center gap-xs">
        <span class="material-symbols-outlined text-[18px]">view_kanban</span> Delegate Tasks
      </a>
    </div>
  </header>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-md mb-lg" id="kpis"></div>

  <div class="grid grid-cols-12 gap-md mb-lg">
    <!-- Pending approvals -->
    <section class="col-span-12 lg:col-span-8 bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
      <div class="p-md border-b border-outline-variant flex justify-between items-center">
        <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="material-symbols-outlined text-primary">pending_actions</span> Awaiting My Signature</h3>
        <a href="approvals.html" class="text-primary hover:underline font-label-caps text-label-caps">VIEW ALL</a>
      </div>
      <div id="pending-list" class="divide-y divide-outline-variant"></div>
    </section>

    <!-- Team -->
    <section class="col-span-12 lg:col-span-4 bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-primary">groups</span> My Team</h3>
      <div id="team-list" class="space-y-sm"></div>
    </section>
  </div>

  <!-- Upcoming meetings -->
  <section class="bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
    <div class="p-md border-b border-outline-variant flex justify-between items-center">
      <h3 class="font-h3 text-h3">Upcoming &amp; Recent Meetings</h3>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-left text-body-sm">
        <thead class="bg-surface-container-low border-b border-outline-variant"><tr>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Meeting</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Date</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant">Status</th>
          <th class="py-sm px-md font-label-caps text-label-caps text-on-surface-variant text-right">Actions</th>
        </tr></thead>
        <tbody id="meetings-body"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'head', title: 'Department Dashboard' });
  if (!user) throw 'redirect';

  document.getElementById('welcome').textContent = `Welcome, ${user.name.split(' ').slice(0,2).join(' ')}.`;
  const dept = SMStore.listAll(SMStore.KEYS.departments).find(d => d.id === user.departmentId);
  document.getElementById('dept-name').textContent = dept ? `${dept.name} (${dept.short})` : '—';

  const meetings = SMStore.scopeMeetings(user, SMStore.listAll(SMStore.KEYS.meetings));
  const tasks = SMStore.scopeTasks(user, SMStore.listAll(SMStore.KEYS.tasks));
  const team = SMStore.scopeUsers(user, SMStore.listAll(SMStore.KEYS.users));

  // KPIs
  const kpis = [
    { l: 'Department Meetings',  v: meetings.length,                                   i: 'event', tone: 'primary' },
    { l: 'Pending Approvals',    v: meetings.filter(m=>m.status==='pending_approval').length, i: 'pending_actions', tone: 'tertiary' },
    { l: 'Active Tasks',          v: tasks.filter(t=>t.status!=='done').length,         i: 'task_alt', tone: 'primary' },
    { l: 'Team Members',         v: team.length,                                       i: 'groups',   tone: 'tertiary' },
  ];
  document.getElementById('kpis').innerHTML = kpis.map(k => `
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md relative overflow-hidden">
      <div class="absolute top-0 right-0 w-1 h-full ${k.tone==='primary'?'bg-primary':'bg-tertiary-container'}"></div>
      <div class="flex items-center justify-between mb-sm">
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">${k.l}</span>
        <span class="material-symbols-outlined ${k.tone==='primary'?'text-primary':'text-tertiary-container'}">${k.i}</span>
      </div>
      <p class="font-display text-[36px] font-bold leading-none">${k.v}</p>
    </div>
  `).join('');

  // Pending approvals
  const pending = meetings.filter(m => m.status === 'pending_approval');
  document.getElementById('pending-list').innerHTML = pending.length === 0
    ? '<div class="p-md text-on-surface-variant text-center">No documents awaiting your signature.</div>'
    : pending.map(m => `
      <div class="p-md flex items-center justify-between hover:bg-surface-container-low transition-colors">
        <div class="flex items-center gap-md">
          <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center"><span class="material-symbols-outlined">description</span></div>
          <div>
            <p class="font-body-md font-semibold">${SmartMin.escapeHtml(m.title)}</p>
            <p class="font-caption text-caption text-on-surface-variant">${SmartMin.fmtDate(m.date)} · MoM ready for approval</p>
          </div>
        </div>
        <a href="approvals.html?m=${m.id}" class="bg-primary text-on-primary px-md py-xs rounded-lg shadow-primary-md flex items-center gap-xs font-semibold">
          <span class="material-symbols-outlined text-[16px]">draw</span> Review
        </a>
      </div>
    `).join('');

  // Team list
  document.getElementById('team-list').innerHTML = team.slice(0, 6).map(u => `
    <div class="flex items-center gap-sm p-sm rounded-lg hover:bg-surface-container-low transition-colors">
      <div class="w-9 h-9 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-xs">${SmartMin.initials(u.name)}</div>
      <div class="flex-1 min-w-0"><p class="font-body-sm font-semibold truncate">${SmartMin.escapeHtml(u.name)}</p><p class="font-caption text-caption text-on-surface-variant truncate">${SmartMin.escapeHtml(u.position||u.role)}</p></div>
      <span class="material-symbols-outlined text-[18px] ${u.active!==false?'text-success':'text-on-surface-variant'}">${u.active!==false?'circle':'block'}</span>
    </div>
  `).join('');

  // Meetings table
  document.getElementById('meetings-body').innerHTML = meetings.slice(0,8).map(m => {
    const pillCls = m.status === 'approved' ? 'pill-done' : m.status === 'pending_approval' ? 'pill-progress' : 'pill-pending';
    return `
      <tr class="border-b border-outline-variant hover:bg-surface-container-low">
        <td class="py-sm px-md font-semibold">${SmartMin.escapeHtml(m.title)}</td>
        <td class="py-sm px-md text-on-surface-variant">${SmartMin.fmtDate(m.date, true)}</td>
        <td class="py-sm px-md"><span class="pill ${pillCls}">${m.status.replace('_',' ')}</span></td>
        <td class="py-sm px-md text-right"><a href="approvals.html?m=${m.id}" class="text-primary hover:underline font-semibold">Open</a></td>
      </tr>`;
  }).join('');
</script>
</body>
</html>
