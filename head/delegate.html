<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Task Delegation | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex flex-col md:flex-row md:items-end justify-between gap-md mb-lg">
    <div>
      <h1 class="font-h1 text-h1">Task Delegation Board</h1>
      <p class="font-body-md text-on-surface-variant">Drag cards between columns to update status. Click a card to assign or edit.</p>
    </div>
    <button onclick="openTaskModal()" class="bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md flex items-center gap-xs">
      <span class="material-symbols-outlined text-[18px]">add_task</span> Create Task
    </button>
  </header>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-md">
    <div class="kanban-col bg-surface-container rounded-xl p-md border-2 border-transparent" data-status="pending">
      <div class="flex items-center justify-between mb-md">
        <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="w-3 h-3 rounded-full bg-surface-variant"></span> Pending</h3>
        <span class="font-label-caps text-label-caps bg-surface-container-lowest px-sm py-xs rounded-full" id="count-pending">0</span>
      </div>
      <div id="col-pending" class="space-y-sm min-h-[200px]"></div>
    </div>
    <div class="kanban-col bg-surface-container rounded-xl p-md border-2 border-transparent" data-status="in_progress">
      <div class="flex items-center justify-between mb-md">
        <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="w-3 h-3 rounded-full bg-tertiary-container"></span> In Progress</h3>
        <span class="font-label-caps text-label-caps bg-surface-container-lowest px-sm py-xs rounded-full" id="count-in_progress">0</span>
      </div>
      <div id="col-in_progress" class="space-y-sm min-h-[200px]"></div>
    </div>
    <div class="kanban-col bg-surface-container rounded-xl p-md border-2 border-transparent" data-status="done">
      <div class="flex items-center justify-between mb-md">
        <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="w-3 h-3 rounded-full bg-success"></span> Done</h3>
        <span class="font-label-caps text-label-caps bg-surface-container-lowest px-sm py-xs rounded-full" id="count-done">0</span>
      </div>
      <div id="col-done" class="space-y-sm min-h-[200px]"></div>
    </div>
  </div>
</div>

<!-- Modal -->
<div id="task-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-md">
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-2xl w-full max-w-[560px] overflow-hidden">
    <div class="px-lg py-md border-b border-outline-variant flex items-center justify-between bg-primary text-on-primary">
      <h3 class="font-h3 text-h3" id="t-modal-title">Task</h3>
      <button onclick="closeTaskModal()" class="text-on-primary hover:opacity-80"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="task-form" class="p-lg space-y-md">
      <input type="hidden" id="t-id"/>
      <div><label class="block font-label-caps text-label-caps mb-xs">Title</label><input id="t-title" required class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"/></div>
      <div><label class="block font-label-caps text-label-caps mb-xs">Description</label><textarea id="t-desc" rows="3" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"></textarea></div>
      <div class="grid grid-cols-2 gap-md">
        <div><label class="block font-label-caps text-label-caps mb-xs">Assignee</label><select id="t-assignee" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"></select></div>
        <div><label class="block font-label-caps text-label-caps mb-xs">Priority</label><select id="t-priority" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
        <div><label class="block font-label-caps text-label-caps mb-xs">Deadline</label><input id="t-deadline" type="date" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"/></div>
        <div><label class="block font-label-caps text-label-caps mb-xs">Status</label><select id="t-status" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"><option value="pending">Pending</option><option value="in_progress">In Progress</option><option value="done">Done</option></select></div>
      </div>
      <div class="flex justify-between pt-md border-t border-outline-variant">
        <button type="button" id="t-delete" class="text-error hover:bg-error/10 px-md py-sm rounded-lg flex items-center gap-xs hidden"><span class="material-symbols-outlined text-[18px]">delete</span> Delete</button>
        <div class="flex gap-sm ml-auto">
          <button type="button" onclick="closeTaskModal()" class="px-md py-sm rounded-lg border border-outline-variant">Cancel</button>
          <button type="submit" class="px-md py-sm rounded-lg bg-primary text-on-primary shadow-primary-md flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">save</span> Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'head', title: 'Task Delegation' });
  if (!user) throw 'redirect';

  const team = SMStore.scopeUsers(user, SMStore.listAll(SMStore.KEYS.users)).filter(u => u.role === 'faculty' || u.role === 'secretary');
  document.getElementById('t-assignee').innerHTML = '<option value="">— Unassigned —</option>' + team.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');

  function render() {
    const tasks = SMStore.scopeTasks(user, SMStore.listAll(SMStore.KEYS.tasks));
    ['pending','in_progress','done'].forEach(status => {
      const col = document.getElementById('col-' + status);
      const filtered = tasks.filter(t => t.status === status);
      document.getElementById('count-' + status).textContent = filtered.length;
      col.innerHTML = filtered.length === 0
        ? '<div class="text-center text-on-surface-variant py-md font-caption">Drop tasks here</div>'
        : filtered.map(t => taskCard(t)).join('');
    });
    bindDnD();
  }

  function taskCard(t) {
    const a = SMStore.getById(SMStore.KEYS.users, t.assigneeId);
    const priorityCls = t.priority === 'high' ? 'border-l-error' : t.priority === 'medium' ? 'border-l-tertiary-container' : 'border-l-secondary';
    const overdue = t.deadline && t.status !== 'done' && new Date(t.deadline) < new Date();
    return `
      <div class="kanban-card bg-surface-container-lowest border border-outline-variant border-l-4 ${priorityCls} rounded-lg p-sm cursor-pointer" draggable="true" data-id="${t.id}" onclick="editTask('${t.id}')">
        <div class="flex items-start justify-between gap-xs mb-xs">
          <p class="font-body-sm font-semibold flex-1 leading-tight">${SmartMin.escapeHtml(t.title)}</p>
          ${t.aiExtracted ? '<span class="material-symbols-outlined text-[14px] text-tertiary-container" title="AI extracted">auto_awesome</span>' : ''}
        </div>
        ${t.description ? `<p class="font-caption text-caption text-on-surface-variant mb-sm line-clamp-2">${SmartMin.escapeHtml(t.description.slice(0,90))}</p>` : ''}
        <div class="flex items-center justify-between text-xs">
          <div class="flex items-center gap-xs">
            ${a ? `<div class="w-6 h-6 rounded-full bg-primary/10 text-primary flex items-center justify-center font-bold text-[10px]">${SmartMin.initials(a.name)}</div><span class="text-on-surface-variant">${SmartMin.escapeHtml(a.name.split(' ').slice(0,2).join(' '))}</span>` : '<span class="text-on-surface-variant italic">Unassigned</span>'}
          </div>
          ${t.deadline ? `<span class="font-caption text-[10px] flex items-center gap-xs ${overdue?'text-error font-semibold':'text-on-surface-variant'}"><span class="material-symbols-outlined text-[12px]">schedule</span>${t.deadline}</span>` : ''}
        </div>
      </div>`;
  }
  window.render = render;

  function bindDnD() {
    document.querySelectorAll('.kanban-card').forEach(card => {
      card.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', card.dataset.id);
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
    });
    document.querySelectorAll('.kanban-col').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('drag-over'); });
      col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
      col.addEventListener('drop', e => {
        e.preventDefault();
        col.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const t = SMStore.getById(SMStore.KEYS.tasks, id);
        if (!t) return;
        t.status = col.dataset.status;
        SMStore.upsert(SMStore.KEYS.tasks, t);
        SMStore.audit('task_status_changed', `${t.title} -> ${t.status}`);
        SmartMin.toast(`"${t.title.slice(0,30)}..." moved to ${t.status.replace('_',' ')}`, 'success');
        render();
      });
    });
  }

  function openTaskModal(t) {
    document.getElementById('t-modal-title').textContent = t ? 'Edit Task' : 'Create Task';
    document.getElementById('t-id').value = t?.id || '';
    document.getElementById('t-title').value = t?.title || '';
    document.getElementById('t-desc').value = t?.description || '';
    document.getElementById('t-assignee').value = t?.assigneeId || '';
    document.getElementById('t-priority').value = t?.priority || 'medium';
    document.getElementById('t-deadline').value = t?.deadline || '';
    document.getElementById('t-status').value = t?.status || 'pending';
    document.getElementById('t-delete').classList.toggle('hidden', !t);
    document.getElementById('task-modal').classList.remove('hidden');
  }
  function closeTaskModal() { document.getElementById('task-modal').classList.add('hidden'); }
  function editTask(id) { openTaskModal(SMStore.getById(SMStore.KEYS.tasks, id)); }
  window.openTaskModal = openTaskModal; window.closeTaskModal = closeTaskModal; window.editTask = editTask;

  document.getElementById('t-delete').onclick = () => {
    const id = document.getElementById('t-id').value;
    if (!id) return;
    if (!confirm('Delete this task?')) return;
    const t = SMStore.getById(SMStore.KEYS.tasks, id);
    SMStore.remove(SMStore.KEYS.tasks, id);
    SMStore.audit('task_deleted', t?.title || id);
    SmartMin.toast('Task deleted', 'success');
    closeTaskModal(); render();
  };

  document.getElementById('task-form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('t-id').value;
    const existing = id ? SMStore.getById(SMStore.KEYS.tasks, id) : null;
    const task = {
      id: id || SmartMin.uid('task'),
      title: document.getElementById('t-title').value.trim(),
      description: document.getElementById('t-desc').value.trim(),
      assigneeId: document.getElementById('t-assignee').value || null,
      priority: document.getElementById('t-priority').value,
      deadline: document.getElementById('t-deadline').value,
      status: document.getElementById('t-status').value,
      departmentId: existing?.departmentId || user.departmentId,
      delegatedBy: user.id,
      aiExtracted: existing?.aiExtracted || false,
    };
    SMStore.upsert(SMStore.KEYS.tasks, task);
    SMStore.audit(existing?'task_updated':'task_created', task.title);
    if (task.assigneeId && task.assigneeId !== existing?.assigneeId) {
      SMStore.pushNotification({ type: 'task', title: 'New task delegated', body: `${user.name} assigned you: ${task.title}`, userId: task.assigneeId });
    }
    SmartMin.toast(`Task ${existing?'updated':'created'}`, 'success');
    closeTaskModal(); render();
  });

  render();
</script>

</body>
</html>
