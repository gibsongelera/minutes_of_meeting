<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Transcript Viewer | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/translator.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex items-center justify-between flex-wrap gap-md mb-md">
    <div>
      <a href="my-meetings.html" class="inline-flex items-center gap-xs text-on-surface-variant hover:text-primary mb-xs font-body-sm"><span class="material-symbols-outlined text-[18px]">arrow_back</span> Back to my meetings</a>
      <h1 class="font-h1 text-h1" id="title">Transcript</h1>
      <p class="font-body-md text-on-surface-variant" id="meta">—</p>
    </div>
    <div class="flex gap-sm">
      <select id="t-pick" onchange="loadOther(this.value)" class="bg-surface-container border-transparent focus:border-primary rounded-lg py-sm px-md"></select>
      <button onclick="toggleTrans()" class="bg-tertiary-container/20 border border-tertiary-container/30 text-tertiary-container px-md py-sm rounded-lg flex items-center gap-xs font-semibold" id="btn-trans"><span class="material-symbols-outlined text-[18px]">translate</span> <span id="trans-label">Translate</span></button>
    </div>
  </header>

  <div class="grid grid-cols-12 gap-md">
    <section class="col-span-12 lg:col-span-8 bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <div class="flex items-center justify-between pb-sm border-b border-outline-variant mb-md">
        <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="material-symbols-outlined text-primary">closed_caption</span> Transcript (read-only)</h3>
        <span id="lang-badge" class="pill pill-ai">EN</span>
      </div>
      <div id="segs" class="space-y-md max-h-[600px] overflow-y-auto pr-sm"></div>
    </section>

    <aside class="col-span-12 lg:col-span-4 space-y-md">
      <div class="glass-panel rounded-xl p-md">
        <h3 class="font-h3 text-h3 flex items-center gap-sm mb-md"><span class="material-symbols-outlined text-tertiary-container">auto_awesome</span> AI Summary</h3>
        <p id="summary" class="font-body-md">—</p>
      </div>

      <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
        <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-primary">task_alt</span> Tasks Assigned to Me</h3>
        <div id="my-tasks" class="space-y-sm"></div>
      </div>

      <div id="comments-card" class="comments-panel bg-surface-container-lowest border border-outline-variant rounded-xl p-md hidden">
        <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-primary">forum</span> Discussion</h3>
        <p class="font-caption text-caption text-on-surface-variant mb-sm">Read-only view of the secretary's discussion thread. Visible only to participants.</p>
        <div id="comments-list" class="space-y-sm max-h-[260px] overflow-y-auto pr-xs"></div>
      </div>
    </aside>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'faculty', title: 'Transcript Viewer' });
  if (!user) throw 'redirect';

  const meetings = SMStore.scopeMeetings(user, SMStore.listAll(SMStore.KEYS.meetings));
  const transcripts = SMStore.listAll(SMStore.KEYS.transcripts);
  const allTasks = SMStore.listAll(SMStore.KEYS.tasks);

  document.getElementById('t-pick').innerHTML = meetings.filter(m => m.aiProcessed).map(m => `<option value="${m.id}">${SmartMin.escapeHtml(m.title)}</option>`).join('') || '<option>No transcripts</option>';

  const q = new URLSearchParams(location.search);
  let activeId = q.get('m') || meetings.find(m=>m.aiProcessed)?.id;
  if (activeId) { document.getElementById('t-pick').value = activeId; load(activeId); }

  let originalSegs = null, isTrans = false;
  let activeT = null;

  function loadOther(id) { activeId = id; load(id); }
  window.loadOther = loadOther;

  function load(id) {
    const m = meetings.find(x => x.id === id);
    activeT = transcripts.find(x => x.meetingId === id);
    if (!m || !activeT) { document.getElementById('segs').innerHTML = '<p class="text-on-surface-variant py-xl text-center">No transcript available for this meeting.</p>'; return; }
    document.getElementById('title').textContent = m.title;
    document.getElementById('meta').textContent = `${SmartMin.fmtDate(m.date, true)} · ${m.venue||'—'}`;
    document.getElementById('lang-badge').textContent = activeT.language === 'tl-PH' ? 'TL' : 'EN';
    document.getElementById('trans-label').textContent = activeT.language === 'tl-PH' ? 'Translate to English' : 'Translate to Tagalog';
    originalSegs = JSON.parse(JSON.stringify(activeT.segments)); isTrans = false;
    renderSegs(originalSegs);
    document.getElementById('summary').textContent = activeT.summary || '—';

    const myTasks = allTasks.filter(t => t.meetingId === id && t.assigneeId === user.id);
    document.getElementById('my-tasks').innerHTML = myTasks.length === 0
      ? '<p class="font-body-sm text-on-surface-variant italic">No tasks assigned to you from this meeting.</p>'
      : myTasks.map(t => `
        <a href="my-tasks.html?t=${t.id}" class="block p-sm bg-surface-container-low rounded-lg border border-outline-variant hover:border-primary transition-colors">
          <p class="font-body-sm font-semibold">${SmartMin.escapeHtml(t.title)}</p>
          <div class="flex gap-xs mt-xs">
            <span class="pill ${t.status==='done'?'pill-done':t.status==='in_progress'?'pill-progress':'pill-pending'}">${t.status.replace('_',' ')}</span>
            ${t.deadline ? `<span class="font-caption text-caption text-on-surface-variant">${t.deadline}</span>` : ''}
          </div>
        </a>
      `).join('');

    // Comments (participants only)
    const isParticipant = (m.participantIds || []).includes(user.id);
    const commentsCard = document.getElementById('comments-card');
    if (isParticipant && (activeT.comments || []).length) {
      commentsCard.classList.remove('hidden');
      const all = activeT.comments || [];
      const users = SMStore.listAll(SMStore.KEYS.users);
      const roots = all.filter(c => !c.parentId);
      function renderC(c, isReply) {
        const u = users.find(x => x.id === c.userId);
        const replies = all.filter(r => r.parentId === c.id);
        return `
          <div class="comment ${isReply?'reply':''}">
            <div class="flex gap-sm">
              ${SmartMin.avatarMarkup(u || { name: c.name }, 'w-8 h-8 text-[11px]')}
              <div class="flex-1 min-w-0">
                <div class="flex items-baseline gap-sm">
                  <p class="font-body-sm font-semibold truncate">${SmartMin.escapeHtml(c.name)}</p>
                  <p class="font-caption text-caption text-on-surface-variant">${SmartMin.fmtDate(c.ts, true)}</p>
                </div>
                <p class="font-body-sm whitespace-pre-wrap">${SmartMin.escapeHtml(c.text)}</p>
              </div>
            </div>
            ${replies.map(r => renderC(r, true)).join('')}
          </div>
        `;
      }
      document.getElementById('comments-list').innerHTML = roots.map(c => renderC(c, false)).join('');
    } else if (isParticipant) {
      commentsCard.classList.remove('hidden');
      document.getElementById('comments-list').innerHTML = '<p class="text-on-surface-variant italic font-body-sm">No comments yet.</p>';
    } else {
      commentsCard.classList.add('hidden');
    }
  }

  function renderSegs(segs) {
    document.getElementById('segs').innerHTML = segs.map(s => `
      <div class="border-l-2 border-${s.speaker?.includes('Gomez')?'primary':'outline-variant'} pl-md py-xs ${s.speaker?.includes('Gomez')?'bg-primary/5 rounded-r-lg':''}">
        <div class="font-label-caps text-label-caps mb-xs ${s.speaker?.includes('Gomez')?'text-primary':'text-on-surface-variant'}">${SmartMin.escapeHtml(s.speaker||'')} · ${SmartMin.fmtTime(s.t)}</div>
        <p class="font-body-md text-on-surface">${SmartMin.escapeHtml(s.text)}</p>
      </div>
    `).join('');
  }

  function toggleTrans() {
    if (!activeT) return;
    if (isTrans) { renderSegs(originalSegs); isTrans = false;
      document.getElementById('lang-badge').textContent = activeT.language === 'tl-PH' ? 'TL' : 'EN';
      document.getElementById('trans-label').textContent = activeT.language === 'tl-PH' ? 'Translate to English' : 'Translate to Tagalog';
    } else {
      const dir = activeT.language === 'tl-PH' ? 'tl-en' : 'en-tl';
      renderSegs(SMTranslator.translateSegments(originalSegs, dir));
      isTrans = true;
      document.getElementById('lang-badge').textContent = activeT.language === 'tl-PH' ? 'EN' : 'TL';
      document.getElementById('trans-label').textContent = 'Show Original';
      SmartMin.toast('Translated', 'ai');
    }
  }
  window.toggleTrans = toggleTrans;
</script>

</body>
</html>
