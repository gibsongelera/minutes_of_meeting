<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Faculty Dashboard | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="mb-lg">
    <h1 class="font-h1 text-h1" id="welcome">My Dashboard</h1>
    <p class="font-body-md text-on-surface-variant" id="dept-line">—</p>
  </header>

  <div class="grid grid-cols-2 lg:grid-cols-4 gap-md mb-lg" id="kpis"></div>

  <div class="grid grid-cols-12 gap-md">
    <!-- My tasks -->
    <section class="col-span-12 lg:col-span-7 bg-surface-container-lowest border border-outline-variant rounded-xl overflow-hidden">
      <div class="p-md border-b border-outline-variant flex justify-between items-center">
        <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="material-symbols-outlined text-primary">task_alt</span> My Active Tasks</h3>
        <a href="my-tasks.html" class="text-primary hover:underline font-label-caps text-label-caps">VIEW ALL</a>
      </div>
      <div id="task-list" class="divide-y divide-outline-variant"></div>
    </section>

    <!-- Upcoming -->
    <section class="col-span-12 lg:col-span-5 bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
      <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-primary">event_upcoming</span> Upcoming Meetings</h3>
      <div id="upcoming" class="space-y-sm"></div>
    </section>
  </div>

  <!-- Personal meetings -->
  <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md mt-md">
    <div class="flex items-center justify-between mb-md">
      <h3 class="font-h3 text-h3 flex items-center gap-sm"><span class="material-symbols-outlined text-primary">event_available</span> Personal Meeting Log</h3>
      <div class="flex gap-sm">
        <a href="personal-meetings.html" class="text-primary hover:underline font-label-caps text-label-caps">VIEW ALL</a>
        <a href="personal-meetings.html" class="bg-primary text-on-primary rounded-lg px-sm py-xs font-label-caps text-label-caps shadow-primary-md flex items-center gap-xs"><span class="material-symbols-outlined text-[14px]">add</span> LOG</a>
      </div>
    </div>
    <div id="personal-mtg" class="space-y-sm"></div>
  </section>

  <!-- Notifications -->
  <section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md mt-md">
    <h3 class="font-h3 text-h3 mb-md flex items-center gap-sm"><span class="material-symbols-outlined text-tertiary-container">notifications_active</span> Recent Notifications</h3>
    <div id="notifs" class="space-y-sm"></div>
  </section>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'faculty', title: 'My Dashboard' });
  if (!user) throw 'redirect';

  document.getElementById('welcome').textContent = `Hello, ${user.name.split(' ').slice(0,2).join(' ')}.`;
  const dept = SMStore.listAll(SMStore.KEYS.departments).find(d => d.id === user.departmentId);
  document.getElementById('dept-line').textContent = dept ? `${dept.name} (${dept.short})` : '';

  const tasks = SMStore.scopeTasks(user, SMStore.listAll(SMStore.KEYS.tasks));
  const meetings = SMStore.scopeMeetings(user, SMStore.listAll(SMStore.KEYS.meetings));

  document.getElementById('kpis').innerHTML = [
    { l: 'Open Tasks',      v: tasks.filter(t=>t.status!=='done').length, i: 'task_alt',     tone: 'primary' },
    { l: 'Completed',       v: tasks.filter(t=>t.status==='done').length, i: 'check_circle', tone: 'tertiary' },
    { l: 'My Meetings',     v: meetings.length, i: 'event',                                   tone: 'primary' },
    { l: 'AI Transcripts',  v: SMStore.listAll(SMStore.KEYS.transcripts).filter(t=>meetings.some(m=>m.id===t.meetingId)).length, i:'closed_caption', tone: 'tertiary' },
  ].map(k => `
    <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md relative overflow-hidden">
      <div class="absolute top-0 right-0 w-1 h-full ${k.tone==='primary'?'bg-primary':'bg-tertiary-container'}"></div>
      <div class="flex items-center justify-between mb-sm">
        <span class="font-label-caps text-label-caps text-on-surface-variant uppercase">${k.l}</span>
        <span class="material-symbols-outlined ${k.tone==='primary'?'text-primary':'text-tertiary-container'}">${k.i}</span>
      </div>
      <p class="font-display text-[36px] font-bold leading-none">${k.v}</p>
    </div>
  `).join('');

  // Task list
  const open = tasks.filter(t => t.status !== 'done').slice(0, 6);
  document.getElementById('task-list').innerHTML = open.length === 0
    ? '<p class="p-md text-on-surface-variant">All caught up! No active tasks.</p>'
    : open.map(t => {
        const overdue = t.deadline && new Date(t.deadline) < new Date();
        return `
          <div class="p-md flex items-center justify-between hover:bg-surface-container-low transition-colors">
            <div class="flex items-start gap-md flex-1 min-w-0">
              <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined">checklist</span></div>
              <div class="flex-1 min-w-0">
                <p class="font-body-md font-semibold truncate">${SmartMin.escapeHtml(t.title)}</p>
                <div class="flex gap-sm mt-xs">
                  ${t.aiExtracted ? '<span class="pill pill-ai">AI Extracted</span>' : ''}
                  <span class="pill ${t.status==='in_progress'?'pill-progress':'pill-pending'}">${t.status.replace('_',' ')}</span>
                  ${t.deadline ? `<span class="font-caption text-caption ${overdue?'text-error font-semibold':'text-on-surface-variant'}"><span class="material-symbols-outlined text-[12px]">schedule</span> ${t.deadline}</span>` : ''}
                </div>
              </div>
            </div>
            <a href="my-tasks.html?t=${t.id}" class="text-primary hover:underline font-semibold ml-md">Open</a>
          </div>
        `;
      }).join('');

  // Upcoming meetings
  const now = Date.now();
  const upcoming = meetings.filter(m => new Date(m.date).getTime() >= now - 86400000).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,5);
  document.getElementById('upcoming').innerHTML = upcoming.length === 0
    ? '<p class="text-on-surface-variant">No upcoming meetings.</p>'
    : upcoming.map(m => `
      <div class="p-sm bg-surface-container-low rounded-lg border border-outline-variant flex items-center gap-sm">
        <div class="w-9 h-9 rounded-lg bg-primary text-on-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[18px]">event</span></div>
        <div class="flex-1 min-w-0">
          <p class="font-body-sm font-semibold truncate">${SmartMin.escapeHtml(m.title)}</p>
          <p class="font-caption text-caption text-on-surface-variant">${SmartMin.fmtDate(m.date, true)} · ${SmartMin.escapeHtml(m.venue||'TBA')}</p>
        </div>
      </div>
    `).join('');

  // Personal meeting log
  const personal = SMStore.scopePersonalMeetings(user, SMStore.listAll(SMStore.KEYS.personalMeetings))
    .sort((a,b)=>new Date(`${b.date}T${b.time||'00:00'}`)-new Date(`${a.date}T${a.time||'00:00'}`))
    .slice(0, 4);
  document.getElementById('personal-mtg').innerHTML = personal.length === 0
    ? '<p class="text-on-surface-variant text-body-sm italic">No personal meetings logged yet. Use the Personal Meetings page to track your one-on-ones and advising sessions.</p>'
    : personal.map(p => `
      <a href="personal-meetings.html?id=${p.id}" class="block p-sm bg-surface-container-low rounded-lg border border-outline-variant hover:border-primary transition-colors">
        <div class="flex items-baseline gap-sm">
          <p class="font-body-sm font-semibold flex-1 truncate">${SmartMin.escapeHtml(p.title)}</p>
          <span class="pill pill-regular">${SmartMin.escapeHtml(p.type||'Personal')}</span>
        </div>
        <p class="font-caption text-caption text-on-surface-variant">${SmartMin.escapeHtml(p.date)} ${p.time?'· '+SmartMin.escapeHtml(p.time):''}${p.attendees?' · '+SmartMin.escapeHtml(p.attendees):''}</p>
      </a>
    `).join('');

  // Notifications
  const notifs = SMStore.read(SMStore.KEYS.notifications, []).filter(n => n.userId === user.id || !n.userId).slice(0, 5);
  document.getElementById('notifs').innerHTML = notifs.length === 0
    ? '<p class="text-on-surface-variant">No notifications.</p>'
    : notifs.map(n => `
      <div class="p-sm rounded-lg flex items-start gap-sm ${n.read?'bg-surface-container-low':'bg-tertiary-fixed/30 border-l-4 border-tertiary-container'}">
        <span class="material-symbols-outlined text-${n.type==='ai'?'tertiary-container':n.type==='approval'?'primary':'on-surface-variant'} mt-xs">${n.type==='ai'?'auto_awesome':n.type==='approval'?'fact_check':n.type==='task'?'task_alt':'info'}</span>
        <div class="flex-1 min-w-0">
          <p class="font-body-sm font-semibold">${SmartMin.escapeHtml(n.title)}</p>
          <p class="font-caption text-caption text-on-surface-variant">${SmartMin.escapeHtml(n.body)} · ${SmartMin.fmtDate(n.ts, true)}</p>
        </div>
      </div>
    `).join('');
</script>

</body>
</html>
