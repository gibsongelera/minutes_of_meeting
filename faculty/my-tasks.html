<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Tasks | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="mb-lg">
    <h1 class="font-h1 text-h1">My Tasks</h1>
    <p class="font-body-md text-on-surface-variant">Action items delegated to you from meetings and direct assignments.</p>
  </header>

  <div class="flex gap-sm mb-md flex-wrap">
    <button onclick="setFilter('')" class="filter-btn px-md py-sm rounded-lg bg-primary text-on-primary shadow-primary-md" data-f="">All</button>
    <button onclick="setFilter('pending')" class="filter-btn px-md py-sm rounded-lg border border-outline-variant" data-f="pending">Pending</button>
    <button onclick="setFilter('in_progress')" class="filter-btn px-md py-sm rounded-lg border border-outline-variant" data-f="in_progress">In Progress</button>
    <button onclick="setFilter('done')" class="filter-btn px-md py-sm rounded-lg border border-outline-variant" data-f="done">Done</button>
  </div>

  <div id="tasks" class="grid grid-cols-1 md:grid-cols-2 gap-md"></div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'faculty', title: 'My Tasks' });
  if (!user) throw 'redirect';

  let filter = '';
  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.filter-btn').forEach(b => {
      const active = b.dataset.f === f;
      b.className = `filter-btn px-md py-sm rounded-lg ${active?'bg-primary text-on-primary shadow-primary-md':'border border-outline-variant'}`;
    });
    render();
  }
  window.setFilter = setFilter;

  function render() {
    const meetings = SMStore.listAll(SMStore.KEYS.meetings);
    const users = SMStore.listAll(SMStore.KEYS.users);
    let list = SMStore.scopeTasks(user, SMStore.listAll(SMStore.KEYS.tasks));
    if (filter) list = list.filter(t => t.status === filter);

    document.getElementById('tasks').innerHTML = list.length === 0
      ? '<p class="col-span-full text-center text-on-surface-variant py-xl">No tasks match the filter.</p>'
      : list.map(t => {
          const m = meetings.find(x => x.id === t.meetingId);
          const delegator = users.find(u => u.id === t.delegatedBy);
          const overdue = t.deadline && t.status !== 'done' && new Date(t.deadline) < new Date();
          const priorityCls = t.priority === 'high' ? 'border-l-error' : t.priority === 'medium' ? 'border-l-tertiary-container' : 'border-l-secondary';
          return `
            <div class="bg-surface-container-lowest border border-outline-variant border-l-4 ${priorityCls} rounded-xl p-md">
              <div class="flex items-start justify-between gap-sm mb-sm">
                <h3 class="font-h3 text-h3 flex-1">${SmartMin.escapeHtml(t.title)}</h3>
                ${t.aiExtracted ? '<span class="ai-badge">AI</span>' : ''}
              </div>
              ${t.description ? `<p class="font-body-sm text-on-surface-variant mb-sm">${SmartMin.escapeHtml(t.description)}</p>` : ''}
              <div class="flex flex-wrap gap-sm mb-md">
                <span class="pill ${t.status==='done'?'pill-done':t.status==='in_progress'?'pill-progress':'pill-pending'}">${t.status.replace('_',' ')}</span>
                <span class="pill ${t.priority==='high'?'pill-overdue':t.priority==='medium'?'pill-progress':'pill-pending'}">${t.priority}</span>
                ${t.deadline ? `<span class="font-caption text-caption flex items-center gap-xs ${overdue?'text-error font-semibold':'text-on-surface-variant'}"><span class="material-symbols-outlined text-[14px]">schedule</span>${t.deadline}${overdue?' (overdue)':''}</span>` : ''}
              </div>
              <div class="pt-md border-t border-outline-variant flex items-center justify-between text-caption">
                <p class="text-on-surface-variant">From: ${m ? SmartMin.escapeHtml(m.title) : '—'}${delegator?' · '+SmartMin.escapeHtml(delegator.name):''}</p>
                <select onchange="updateStatus('${t.id}', this.value)" class="bg-surface-container border-transparent focus:border-primary rounded-lg py-xs px-sm text-body-sm">
                  <option value="pending"${t.status==='pending'?' selected':''}>Pending</option>
                  <option value="in_progress"${t.status==='in_progress'?' selected':''}>In Progress</option>
                  <option value="done"${t.status==='done'?' selected':''}>Done</option>
                </select>
              </div>
            </div>
          `;
        }).join('');
  }
  window.render = render;

  function updateStatus(id, status) {
    const t = SMStore.getById(SMStore.KEYS.tasks, id);
    if (!t) return;
    t.status = status;
    SMStore.upsert(SMStore.KEYS.tasks, t);
    SMStore.audit('task_status_changed', `${t.title} -> ${status} (by faculty)`);
    SmartMin.toast(`Status updated to ${status.replace('_',' ')}`, 'success');
    render();
  }
  window.updateStatus = updateStatus;
  render();
</script>

</body>
</html>
