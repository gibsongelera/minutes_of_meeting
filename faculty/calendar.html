<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calendar | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
<script src="../assets/js/calendar.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="mb-lg flex flex-wrap items-end gap-sm justify-between">
    <div>
      <h1 class="font-h1 text-h1 flex items-center gap-sm"><span class="material-symbols-outlined text-primary text-[36px]">calendar_month</span> My Calendar</h1>
      <p class="font-body-md text-on-surface-variant">Meetings you are part of, plus your personal log. Click any event for details.</p>
    </div>
    <div class="flex gap-sm">
      <a href="personal-meetings.html" class="bg-primary text-on-primary rounded-lg px-md py-sm font-label-caps text-label-caps shadow-primary-md hover:opacity-90 flex items-center gap-sm"><span class="material-symbols-outlined text-[18px]">add</span> Log Personal Meeting</a>
    </div>
  </header>

  <div id="calendar-mount"></div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'faculty', title: 'Calendar' });
  if (!user) throw 'redirect';

  const meetings  = SMStore.scopeMeetings(user, SMStore.listAll(SMStore.KEYS.meetings));
  const personal  = SMStore.scopePersonalMeetings(user, SMStore.listAll(SMStore.KEYS.personalMeetings));
  const events    = SMCalendar.flattenEvents(meetings, personal);

  SMCalendar.renderInto(document.getElementById('calendar-mount'), {
    events,
    role: user.role,
    onEventClick: ev => {
      if (ev.kind === 'personal') {
        location.href = `personal-meetings.html?id=${ev.id}`;
      } else if (ev.kind === 'meeting') {
        if (ev.transcriptId) location.href = `transcript-view.html?meeting=${ev.id}`;
        else location.href = `my-meetings.html?m=${ev.id}`;
      }
    }
  });

  SMStore.audit('calendar_view', `faculty calendar (${meetings.length} meetings + ${personal.length} personal)`);
</script>

</body>
</html>
