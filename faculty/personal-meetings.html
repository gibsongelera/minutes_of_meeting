<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Personal Meetings | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="flex flex-col md:flex-row md:items-end justify-between gap-md mb-lg no-print">
    <div>
      <h1 class="font-h1 text-h1 flex items-center gap-sm"><span class="material-symbols-outlined text-primary text-[36px]">event_available</span> My Personal Meetings</h1>
      <p class="font-body-md text-on-surface-variant">Log advising, consultations, or any private meeting that isn't part of an institutional agenda. Visible to you only.</p>
    </div>
    <div class="flex gap-sm">
      <button onclick="exportPrint()" class="border border-outline-variant px-md py-sm rounded-lg flex items-center gap-sm hover:bg-surface-container-low"><span class="material-symbols-outlined text-[18px]">print</span> Print / Export</button>
      <button onclick="openModal()" class="bg-primary text-on-primary rounded-lg px-md py-sm font-label-caps text-label-caps shadow-primary-md hover:opacity-90 flex items-center gap-sm"><span class="material-symbols-outlined text-[18px]">add</span> New Personal Meeting</button>
    </div>
  </header>

  <div id="empty-state" class="hidden text-center py-xl bg-surface-container-low border border-dashed border-outline-variant rounded-xl no-print">
    <span class="material-symbols-outlined text-[64px] text-on-surface-variant">event_busy</span>
    <p class="font-body-md text-on-surface-variant mt-sm">No personal meetings logged yet. Click <strong>New Personal Meeting</strong> to add one.</p>
  </div>

  <div id="pm-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-md"></div>

  <!-- Print export -->
  <div id="print-export" class="hidden print:block ched-doc mt-lg">
    <div class="text-center border-b-2 border-primary pb-md mb-lg">
      <h2 class="font-h2 text-h2 text-primary font-bold">Personal Meeting Log</h2>
      <p class="font-body-md" id="print-owner"></p>
      <p class="font-caption text-on-surface-variant" id="print-when"></p>
    </div>
    <div id="print-body"></div>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-[100] flex items-center justify-center p-md">
  <div class="bg-surface-container-lowest rounded-xl border border-outline-variant shadow-2xl w-full max-w-[640px] overflow-hidden max-h-[90vh] flex flex-col">
    <div class="px-lg py-md border-b border-outline-variant flex items-center justify-between bg-primary text-on-primary">
      <h3 class="font-h3 text-h3" id="pm-modal-title">New Personal Meeting</h3>
      <button onclick="closeModal()" class="text-on-primary hover:opacity-80"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="pm-form" class="p-lg space-y-md overflow-y-auto">
      <input type="hidden" id="pm-id"/>

      <div>
        <label class="block font-label-caps text-label-caps mb-xs">Meeting Title</label>
        <input id="pm-title" required class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg" placeholder="Adviser-Advisee Sync"/>
      </div>

      <div class="grid grid-cols-2 gap-md">
        <div>
          <label class="block font-label-caps text-label-caps mb-xs">Date</label>
          <input id="pm-date" type="date" required class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"/>
        </div>
        <div>
          <label class="block font-label-caps text-label-caps mb-xs">Time</label>
          <input id="pm-time" type="time" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg"/>
        </div>
      </div>

      <div>
        <label class="block font-label-caps text-label-caps mb-xs">Type</label>
        <select id="pm-type" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg">
          <option>Adviser-Advisee</option>
          <option>Faculty Consultation</option>
          <option>Student One-on-One</option>
          <option>Committee Sync</option>
          <option>External Engagement</option>
          <option>Other</option>
        </select>
      </div>

      <div>
        <label class="block font-label-caps text-label-caps mb-xs">Attendees</label>
        <input id="pm-att" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg" placeholder="Names or roles, separated by commas"/>
      </div>

      <div>
        <label class="block font-label-caps text-label-caps mb-xs">Discussion Notes</label>
        <textarea id="pm-notes" rows="5" class="w-full px-md py-sm bg-surface-container-low border-2 border-transparent focus:border-primary rounded-lg" placeholder="Topics discussed, decisions, follow-ups..."></textarea>
      </div>

      <div class="flex justify-between pt-md border-t border-outline-variant">
        <button type="button" id="pm-delete" class="text-error hover:bg-error/10 px-md py-sm rounded-lg flex items-center gap-xs hidden"><span class="material-symbols-outlined text-[18px]">delete</span> Delete</button>
        <div class="flex gap-sm ml-auto">
          <button type="button" onclick="closeModal()" class="px-md py-sm rounded-lg border border-outline-variant">Cancel</button>
          <button type="submit" class="px-md py-sm rounded-lg bg-primary text-on-primary shadow-primary-md flex items-center gap-xs"><span class="material-symbols-outlined text-[18px]">save</span> Save</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'faculty', title: 'Personal Meetings' });
  if (!user) throw 'redirect';

  function render() {
    const items = SMStore.scopePersonalMeetings(user, SMStore.listAll(SMStore.KEYS.personalMeetings))
      .sort((a, b) => new Date(`${b.date}T${b.time||'00:00'}`) - new Date(`${a.date}T${a.time||'00:00'}`));

    document.getElementById('empty-state').classList.toggle('hidden', items.length !== 0);

    document.getElementById('pm-list').innerHTML = items.map(p => `
      <div class="folder-card">
        <div class="flex items-start justify-between mb-md">
          <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center"><span class="material-symbols-outlined">event_note</span></div>
          <span class="pill pill-regular">${SmartMin.escapeHtml(p.type || 'Personal')}</span>
        </div>
        <h3 class="font-h3 text-h3 mb-xs">${SmartMin.escapeHtml(p.title)}</h3>
        <p class="font-caption text-caption text-on-surface-variant mb-sm">${SmartMin.escapeHtml(p.date)} ${p.time?'· '+SmartMin.escapeHtml(p.time):''}</p>
        ${p.attendees ? `<p class="font-body-sm mb-sm"><span class="material-symbols-outlined text-[14px] align-middle text-on-surface-variant">group</span> ${SmartMin.escapeHtml(p.attendees)}</p>` : ''}
        ${p.notes ? `<p class="font-body-sm text-on-surface line-clamp-4 mb-md whitespace-pre-wrap">${SmartMin.escapeHtml(p.notes)}</p>` : ''}
        <div class="flex gap-xs pt-md border-t border-outline-variant">
          <button onclick="edit('${p.id}')" class="flex-1 border border-outline-variant px-sm py-xs rounded-lg hover:bg-surface-container text-body-sm flex items-center justify-center gap-xs"><span class="material-symbols-outlined text-[16px]">edit</span> Edit</button>
          <button onclick="del('${p.id}')" class="border border-outline-variant px-sm py-xs rounded-lg hover:bg-error/10 hover:text-error text-body-sm flex items-center justify-center gap-xs"><span class="material-symbols-outlined text-[16px]">delete</span></button>
        </div>
      </div>
    `).join('');

    // Print body
    document.getElementById('print-owner').textContent = `Owner: ${user.name}`;
    document.getElementById('print-when').textContent = `Generated on ${SmartMin.fmtDate(Date.now(), true)}`;
    document.getElementById('print-body').innerHTML = items.length === 0
      ? '<p class="italic">No personal meetings logged.</p>'
      : items.map(p => `
        <div class="mb-md pb-md border-b border-outline-variant">
          <h3 class="font-h3 text-h3">${SmartMin.escapeHtml(p.title)}</h3>
          <p class="font-caption text-caption text-on-surface-variant">${SmartMin.escapeHtml(p.date)} ${SmartMin.escapeHtml(p.time||'')} · ${SmartMin.escapeHtml(p.type||'Personal')}</p>
          ${p.attendees ? `<p class="mt-xs"><strong>Attendees:</strong> ${SmartMin.escapeHtml(p.attendees)}</p>` : ''}
          ${p.notes ? `<p class="mt-xs whitespace-pre-wrap">${SmartMin.escapeHtml(p.notes)}</p>` : ''}
        </div>
      `).join('');
  }
  window.render = render;

  function openModal(p) {
    document.getElementById('pm-modal-title').textContent = p ? 'Edit Personal Meeting' : 'New Personal Meeting';
    document.getElementById('pm-id').value = p?.id || '';
    document.getElementById('pm-title').value = p?.title || '';
    document.getElementById('pm-date').value = p?.date || new Date().toISOString().slice(0,10);
    document.getElementById('pm-time').value = p?.time || '';
    document.getElementById('pm-type').value = p?.type || 'Adviser-Advisee';
    document.getElementById('pm-att').value = p?.attendees || '';
    document.getElementById('pm-notes').value = p?.notes || '';
    document.getElementById('pm-delete').classList.toggle('hidden', !p);
    document.getElementById('modal').classList.remove('hidden');
  }
  function closeModal() { document.getElementById('modal').classList.add('hidden'); }
  function edit(id) {
    const p = SMStore.getById(SMStore.KEYS.personalMeetings, id);
    if (!p || p.userId !== user.id) return;
    openModal(p);
  }
  function del(id) {
    if (!confirm('Delete this personal meeting?')) return;
    const p = SMStore.getById(SMStore.KEYS.personalMeetings, id);
    if (!p || p.userId !== user.id) return;
    SMStore.remove(SMStore.KEYS.personalMeetings, id);
    SMStore.audit('personal_meeting_deleted', p.title);
    SmartMin.toast('Personal meeting removed.', 'success');
    render();
  }
  window.openModal = openModal; window.closeModal = closeModal; window.edit = edit; window.del = del;

  document.getElementById('pm-delete').onclick = () => {
    const id = document.getElementById('pm-id').value;
    if (id) { del(id); closeModal(); }
  };

  document.getElementById('pm-form').addEventListener('submit', e => {
    e.preventDefault();
    const id = document.getElementById('pm-id').value;
    const existing = id ? SMStore.getById(SMStore.KEYS.personalMeetings, id) : null;
    const p = {
      id: id || SmartMin.uid('pm'),
      userId: user.id,
      title: document.getElementById('pm-title').value.trim(),
      date: document.getElementById('pm-date').value,
      time: document.getElementById('pm-time').value,
      type: document.getElementById('pm-type').value,
      attendees: document.getElementById('pm-att').value.trim(),
      notes: document.getElementById('pm-notes').value.trim(),
    };
    SMStore.upsert(SMStore.KEYS.personalMeetings, p);
    SMStore.audit(existing ? 'personal_meeting_updated' : 'personal_meeting_created', p.title);
    SmartMin.toast(`Personal meeting ${existing ? 'updated' : 'logged'}.`, 'success');
    closeModal();
    render();
  });

  function exportPrint() {
    document.getElementById('print-export').classList.remove('hidden');
    setTimeout(() => {
      window.print();
      setTimeout(() => document.getElementById('print-export').classList.add('hidden'), 500);
    }, 100);
  }
  window.exportPrint = exportPrint;

  // Deep link ?id=
  const params = new URLSearchParams(location.search);
  if (params.get('id')) {
    const p = SMStore.getById(SMStore.KEYS.personalMeetings, params.get('id'));
    if (p && p.userId === user.id) openModal(p);
  }

  render();
</script>

</body>
</html>
