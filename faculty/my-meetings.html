<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>My Meetings | ZPPSU SmartMin</title>
<link rel="stylesheet" href="../assets/css/theme.css"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="../assets/js/shared.js"></script>
<script src="../assets/js/store.js"></script>
<script src="../assets/js/seed.js"></script>
</head>
<body class="bg-background">

<div class="p-lg max-w-container-max mx-auto w-full">
  <header class="mb-lg">
    <h1 class="font-h1 text-h1">My Meetings</h1>
    <p class="font-body-md text-on-surface-variant">Meetings you've been a participant in, with transcripts &amp; summaries.</p>
  </header>

  <div id="cards" class="grid grid-cols-1 md:grid-cols-2 gap-md"></div>
</div>

<script>
  const user = SmartMin.mountLayout({ requiredRole: 'faculty', title: 'My Meetings' });
  if (!user) throw 'redirect';

  const meetings = SMStore.scopeMeetings(user, SMStore.listAll(SMStore.KEYS.meetings));
  const transcripts = SMStore.listAll(SMStore.KEYS.transcripts);
  const tasks = SMStore.listAll(SMStore.KEYS.tasks);

  document.getElementById('cards').innerHTML = meetings.length === 0
    ? '<p class="col-span-full text-center text-on-surface-variant py-xl">You have no meetings yet.</p>'
    : meetings.map(m => {
      const t = transcripts.find(x => x.meetingId === m.id);
      const mTasks = tasks.filter(x => x.meetingId === m.id && x.assigneeId === user.id);
      const pillCls = m.status === 'approved' ? 'pill-done' : m.status === 'pending_approval' ? 'pill-progress' : 'pill-pending';
      return `
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
          <div class="flex items-start justify-between mb-md">
            <div class="w-10 h-10 rounded-lg bg-primary/10 text-primary flex items-center justify-center"><span class="material-symbols-outlined">groups</span></div>
            <div class="flex flex-col items-end gap-xs">
              <span class="pill ${pillCls}">${m.status.replace('_',' ')}</span>
              ${m.aiProcessed ? '<span class="pill pill-ai">AI Processed</span>' : ''}
            </div>
          </div>
          <h3 class="font-h3 text-h3 mb-xs">${SmartMin.escapeHtml(m.title)}</h3>
          <p class="font-caption text-caption text-on-surface-variant mb-sm">${SmartMin.fmtDate(m.date, true)} · ${SmartMin.escapeHtml(m.venue||'—')}</p>
          ${t?.summary ? `<div class="bg-tertiary-fixed/30 border-l-4 border-tertiary-container rounded-r-lg p-sm mb-md"><p class="font-body-sm flex items-center gap-xs mb-xs"><span class="material-symbols-outlined text-[16px] text-tertiary-container">auto_awesome</span><strong>AI Summary</strong></p><p class="font-caption text-caption text-on-surface line-clamp-3">${SmartMin.escapeHtml(t.summary)}</p></div>` : ''}
          ${mTasks.length ? `<p class="font-body-sm mb-md flex items-center gap-xs"><span class="material-symbols-outlined text-[16px] text-primary">task_alt</span> <strong>${mTasks.length}</strong> task${mTasks.length>1?'s':''} assigned to you</p>` : ''}
          <a href="transcript-view.html?m=${m.id}" class="block bg-primary text-on-primary px-md py-sm rounded-lg shadow-primary-md text-center hover:opacity-90 flex items-center justify-center gap-xs">
            <span class="material-symbols-outlined text-[18px]">closed_caption</span> View Transcript &amp; Summary
          </a>
        </div>
      `;
    }).join('');
</script>

</body>
</html>
