<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Forgot Password - ZPPSU SmartMin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-container": "#616363",

                        "primary-container": "#800000",
                        "on-secondary-fixed-variant": "#454747",

                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2f3131",
                        "surface-container-high": "#e8e8e8",
                        "surface-tint": "#b22b1d",
                        "primary-fixed": "#ffdad4",
                        "on-tertiary-container": "#4e3d00",
                        "surface-container-highest": "#e2e2e2",
                        "outline-variant": "#e2bfb9",
                        "secondary-container": "#dfe0e0",
                        "primary-fixed-dim": "#ffb4a8",
                        "on-surface-variant": "#5a413d",
                        "tertiary-container": "#cba72f",
                        "on-secondary-fixed": "#1a1c1c",
                        "surface": "#f9f9f9",
                        "on-primary-fixed-variant": "#8f0f07",
                        "on-primary": "#ffffff",
                        "surface-dim": "#dadada",
                        "error-container": "#ffdad6",
                        "background": "#f9f9f9",
                        "surface-container": "#eeeeee",
                        "primary": "#570000",
                        "on-tertiary-fixed-variant": "#574500",
                        "inverse-on-surface": "#f1f1f1",
                        "surface-variant": "#e2e2e2",
                        "secondary-fixed-dim": "#c6c6c7",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#e2e2e2",
                        "inverse-primary": "#ffb4a8",
                        "on-tertiary-fixed": "#241a00",
                        "outline": "#8e706c",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-fixed": "#410000",
                        "on-surface": "#1a1c1c",

                        "surface-container-low": "#f3f3f3"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "8px",
                        "margin": "32px",
                        "lg": "24px",
                        "xs": "4px",
                        "xxl": "64px",
                        "md": "16px",
                        "container-max": "1440px",
                        "xl": "40px",
                        "gutter": "24px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],

                }
            }
        }

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0px 4px 20px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-md antialiased p-md">
<main class="w-full max-w-md mx-auto">
<!-- Brand Header -->
<div class="text-center mb-xl">
<div class="flex items-center justify-center gap-sm mb-md">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">account_balance</span>
</div>
<h1 class="font-h2 text-h2 text-primary mb-xs">ZPPSU SmartMin</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Institutional Governance Platform</p>
</div>
<!-- Recovery Card -->
<div class="glass-panel bg-surface-container-lowest border border-surface-variant rounded-xl p-xl shadow-sm relative overflow-hidden">
<!-- Decorative Accent -->
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-primary-fixed"></div>
<!-- Header -->
<div class="mb-lg">
<h2 class="font-h3 text-h3 text-on-surface mb-sm">Reset Institutional Password</h2>
<div class="flex items-center gap-xs text-on-surface-variant bg-surface-container-low px-sm py-xs rounded-md w-fit">
<span class="material-symbols-outlined text-[16px]">verified_user</span>
<span class="font-caption text-caption">Security Verification: Step 2 of 3</span>
</div>
</div>
<form class="space-y-lg">
<!-- OTP Section -->
<div class="space-y-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm">Verification Code</label>
<p class="font-body-sm text-body-sm text-on-surface-variant mb-md">Enter 6-digit verification code sent to your ZPPSU email.</p>
<!-- OTP Inputs Container -->
<div class="flex gap-sm justify-between">
<input class="w-12 h-14 text-center font-h3 text-h3 bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg transition-colors" maxlength="1" placeholder="•" type="text" value="4"/>
<input class="w-12 h-14 text-center font-h3 text-h3 bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg transition-colors" maxlength="1" placeholder="•" type="text" value="8"/>
<input class="w-12 h-14 text-center font-h3 text-h3 bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg transition-colors" maxlength="1" placeholder="•" type="text" value="1"/>
<input class="w-12 h-14 text-center font-h3 text-h3 bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg transition-colors" maxlength="1" placeholder="•" type="text"/>
<input class="w-12 h-14 text-center font-h3 text-h3 bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg transition-colors" maxlength="1" placeholder="•" type="text"/>
<input class="w-12 h-14 text-center font-h3 text-h3 bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg transition-colors" maxlength="1" placeholder="•" type="text"/>
</div>
</div>
</div>
<div class="h-px bg-surface-variant w-full"></div>
<!-- New Password Section -->
<div class="space-y-md">
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm" for="new_password">New Password</label>
<div class="relative">
<input class="w-full bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-md pl-md pr-xl font-body-md text-body-md transition-colors" id="new_password" placeholder="Enter new password" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
<div>
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-sm" for="confirm_password">Confirm Password</label>
<div class="relative">
<input class="w-full bg-surface-container border-transparent focus:border-primary focus:ring-1 focus:ring-primary rounded-lg py-md pl-md pr-xl font-body-md text-body-md transition-colors" id="confirm_password" placeholder="Confirm new password" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
</div>
</div>
<!-- Actions -->
<div class="pt-sm space-y-md">
<button class="w-full bg-primary text-on-primary font-body-md text-body-md py-md rounded-lg shadow-md shadow-primary/20 hover:bg-on-primary-fixed-variant transition-colors flex justify-center items-center gap-xs" type="button">
                        Update Password
                        <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<div class="text-center">
<a class="font-body-sm text-body-sm text-on-surface-variant hover:text-primary transition-colors inline-flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                            Return to Login
                        </a>
</div>
</div>
</form>
</div>
<!-- Footer Links -->
<div class="mt-lg text-center font-caption text-caption text-on-surface-variant space-x-md">
<a class="hover:text-primary transition-colors" href="#">IT Support</a>
<span>|</span>
<a class="hover:text-primary transition-colors" href="#">Security Policy</a>
</div>
</main>
</body></html>
